function renderSub(){
  const host = document.getElementById('viewBasiskonzepte');
  const tabs = [['dashboard','📊 Dashboard'],['netz','🕸️ Netz'],['detail','📖 Detail']];
  host.innerHTML = `<div style="display:flex; gap:6px; margin-bottom:14px">${tabs.map(([id,l])=>`<button class="pill-btn ${sub===id?'primary':''}" data-tab="${id}">${l}</button>`).join('')}</div><div id="bkSubHost"></div>`;
  host.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ sub=b.dataset.tab; renderSub(); });
  const subHost = document.getElementById('bkSubHost');
  if(sub==='netz') renderNetz(subHost);
  else if(sub==='dashboard') renderDashboard(subHost);
  else if(sub==='detail') renderDetail(subHost);
}

EM.renderers.basiskonzepte = () => renderSub();
})();
</script>

<script>
/* =========================================================================
   VIEW: Evolutionskonzepte-Taxonomie
   ========================================================================= */
(function(){
'use strict';
const esc = EM.esc;
let selected = null;

function lzForConcept(bezeichnung){
  return EM.lz.filter(e => { const b = EM.evoBezug(e); return b && (b.relevante_evolutionskonzepte||[]).includes(bezeichnung); });
}

/* Reused by the Basiskonzepte-Explorer's Detail view (bk_evolutive_entwicklung),
   which folds this taxonomy in instead of hosting it as its own nav item. */
function evoTaxonomyHtml(){
  const all = EM.data.evolutionskonzepte.evolutionskonzepte.slice().sort((a,b)=>a.reihenfolge-b.reihenfolge);
  const top = all.filter(e=>e.ebene===1);
  return `<p style="color:var(--txt-2); font-size:12px; margin:6px 0 10px">Kontrollierte, hierarchische Vokabular-Liste evolutionärer Konzepte (<code>data/evolutionskonzepte.json</code>).</p>` +
    top.map(t=>{
      const children = all.filter(c=>c.uebergeordnetes_konzept===t.id).sort((a,b)=>a.reihenfolge-b.reihenfolge);
      const n = countForConcept(t);
      const ownLinked = lzForConcept(t.bezeichnung);
      return `<details style="margin-bottom:6px">
        <summary style="cursor:pointer; font-size:12.5px; font-weight:650; padding:4px 0">${esc(t.bezeichnung)} <span class="tag" style="background:var(--bg-alt)">${n}</span></summary>
        <div style="padding:4px 0 6px 14px">
          <p style="font-size:12px; color:var(--txt-2); margin:4px 0">${esc(t.definition||'')}</p>
          ${!children.length && ownLinked.length?`<div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px">${ownLinked.map(e=>`<span class="tag" style="background:var(--bg-alt);color:var(--txt-2); cursor:pointer" data-goto="${esc(e.id)}">${esc(e.id)}</span>`).join('')}</div>`:''}
          ${children.map(c=>{
            const linked = lzForConcept(c.bezeichnung);
            return `<details style="margin:6px 0">
              <summary style="cursor:pointer; font-size:12px">${esc(c.bezeichnung)} <span class="tag" style="background:var(--bg-alt); font-size:10px">${linked.length}</span></summary>
              <div style="padding:4px 0 4px 14px">
                <p style="font-size:11.5px; color:var(--txt-2); margin:4px 0">${esc(c.definition||'')}</p>
                <div style="display:flex; flex-wrap:wrap; gap:5px">${linked.map(e=>`<span class="tag" style="background:var(--bg-alt);color:var(--txt-2); cursor:pointer" data-goto="${esc(e.id)}">${esc(e.id)}</span>`).join('') || '<span style="color:var(--txt-3); font-size:11px">Keine direkten Treffer</span>'}</div>
              </div>
            </details>`;
          }).join('')}
        </div>
      </details>`;
    }).join('');
}
EM.evoTaxonomyHtml = evoTaxonomyHtml;

function countForConcept(ek){
  const own = lzForConcept(ek.bezeichnung).length;
  if(ek.ebene===1){
    const children = EM.data.evolutionskonzepte.evolutionskonzepte.filter(c=>c.uebergeordnetes_konzept===ek.id);
    return own + children.reduce((s,c)=>s+lzForConcept(c.bezeichnung).length, 0);
  }
  return own;
}

function detailHtml(ek){
  const linked = lzForConcept(ek.bezeichnung);
  return `<div class="card card-pad">
    <h2 style="margin:0 0 6px; font-size:17px">${esc(ek.bezeichnung)}</h2>
    <span class="tag" style="background:var(--green-pale);color:var(--green)">${ek.ebene===1?'Hauptkonzept':'Unterkonzept'}</span>
    <p style="margin:10px 0; font-size:13px">${esc(ek.definition)}</p>
    <p style="margin:0 0 10px; font-size:12.5px; color:var(--txt-2)"><b>Beispiel:</b> ${esc(ek.beispiel)}</p>
    <div class="section-h">Lernziele mit diesem Bezug (${linked.length})</div>
    <div style="display:flex; flex-direction:column; gap:6px; max-height:50vh; overflow:auto">
      ${linked.map(e=>`<div class="chip" style="justify-content:space-between; cursor:pointer" data-goto="${esc(e.id)}"><span>${esc(e.id)} — ${esc(e.kurzbezeichnung)}</span><span style="color:var(--txt-3)">${EM.BAND_META[e.band].label}</span></div>`).join('') || '<span style="color:var(--txt-3); font-size:12.5px">Noch keine direkten Treffer — Relevanz wird oft über das übergeordnete Hauptkonzept vermittelt.</span>'}
    </div>
  </div>`;
}

function render(){
  const host = document.getElementById('viewEvokonzepte');
  const all = EM.data.evolutionskonzepte.evolutionskonzepte.slice().sort((a,b)=>a.reihenfolge-b.reihenfolge);
  const top = all.filter(e=>e.ebene===1);
  if(!selected) selected = top[0];

  const treeHtml = top.map(t=>{
    const children = all.filter(c=>c.uebergeordnetes_konzept===t.id).sort((a,b)=>a.reihenfolge-b.reihenfolge);
    const n = countForConcept(t);
    return `<div class="nav-item" data-sel="${t.id}" style="${selected.id===t.id?'background:var(--teal-pale);color:var(--teal)':''}"><span style="flex:1">${esc(t.bezeichnung)}</span><span class="tag" style="background:var(--bg-alt)">${n}</span></div>`+
      children.map(c=>{
        const cn = countForConcept(c);
        return `<div class="nav-item" data-sel="${c.id}" style="padding-left:24px; font-size:12px; ${selected.id===c.id?'background:var(--teal-pale);color:var(--teal)':''}"><span style="flex:1">${esc(c.bezeichnung)}</span><span class="tag" style="background:var(--bg-alt); font-size:10px">${cn}</span></div>`;
      }).join('');
  }).join('');

  host.innerHTML = `
  <p style="color:var(--txt-2); font-size:12.5px; margin-bottom:14px">Kontrollierte, hierarchische Vokabular-Liste evolutionärer Konzepte (<code>data/evolutionskonzepte.json</code>) — jedes Lernziel mit Evolutionsbezug verweist auf 1–4 dieser Konzepte. Zahlen zeigen, wie viele Lernziele über alle Klassenstufen hinweg dieses Konzept berühren.</p>
  <div style="display:grid; grid-template-columns:290px 1fr; gap:16px">
    <div class="card card-pad" style="max-height:75vh; overflow:auto">${treeHtml}</div>
    <div id="ekDetailHost">${detailHtml(selected)}</div>
  </div>`;

  host.querySelectorAll('[data-sel]').forEach(n=>n.onclick=()=>{ selected = EM.ekById[n.dataset.sel]; render(); });
  host.querySelectorAll('[data-goto]').forEach(n=>n.onclick=()=>{ EM.setView('lernziele'); document.getElementById('globalSearch').value=n.dataset.goto; EM.globalQuery=n.dataset.goto.toLowerCase(); EM.renderers.lernziele(); });
}

EM.renderers.evokonzepte = render;
})();
</script>

<script>
/* =========================================================================
   VIEW: Sequenzplaner — Jahresplanung über Klassenstufen 5-10 mit
   Qualitätsanalyse, inkl. klassenstufenübergreifender Kohärenzfaden-Prüfung.
   ========================================================================= */
(function(){
'use strict';
const esc = EM.esc;
const GRADES = ['5','6','7','8','9','10'];
const QUARTERS = ['Q1','Q2','Q3','Q4'];
function cellKey(g,q){ return g+'-'+q; }
function plan(){ return EM.state.seqPlan; }
function cellList(g,q){ const k=cellKey(g,q); return plan()[k] || (plan()[k]=[]); }
function placedIds(){ const s=new Set(); for(const k in plan()) plan()[k].forEach(id=>s.add(id)); return s; }
function gradeOf(e){ return String(e.empfohlene_klassenstufe||'').match(/\d+/)?.[0] || ''; }

function unplacedList(query){
  const placed = placedIds();
  return EM.lz.filter(e => !placed.has(e.id) && (!query || (e.id+e.kurzbezeichnung).toLowerCase().includes(query)));
}

function autoFill(){
  for(const e of EM.lz){
    const g = gradeOf(e); const q = e.empfohlenes_quartal || 'Q1';
    if(!g || !GRADES.includes(g)) continue;
    const k = cellKey(g,q);
    const list = plan()[k] || (plan()[k]=[]);
    if(!placedIds().has(e.id)) list.push(e.id);
  }
  EM.saveState(); render();
  EM.toast('Automatisch nach empfohlener Klassenstufe/Quartal befüllt');
}

function clearPlan(){ EM.state.seqPlan = {}; EM.saveState(); render(); }

function computeFindings(){
  const findings = [];
  const placedAt = {}; // id -> {g,q,idx}
  GRADES.forEach(g=>QUARTERS.forEach(q=>{ (plan()[cellKey(g,q)]||[]).forEach((id,idx)=>{ placedAt[id] = {g,q,order:GRADES.indexOf(g)*4+QUARTERS.indexOf(q)}; }); }));

  // 1. prerequisites out of order
  for(const e of EM.lz){
    const pa = placedAt[e.id]; if(!pa) continue;
    for(const req of (e.voraussetzende_lernziele||[])){
      const rp = placedAt[req];
      if(rp && rp.order > pa.order){
        findings.push({sev:'critical', text:`${e.id} steht vor seiner Voraussetzung ${req} im Plan.`});
      }
    }
  }
  // 2. missing konzeptanker
  const ankerMissing = EM.lz.filter(e=>e.ist_konzeptanker && !placedAt[e.id]);
  if(ankerMissing.length) findings.push({sev:'advisory', text:`${ankerMissing.length} Konzeptanker-Lernziele sind noch nicht eingeplant: ${ankerMissing.slice(0,5).map(e=>e.id).join(', ')}${ankerMissing.length>5?'…':''}`});

  // 3. BK with zero placed
  for(const bkid in EM.BK_COLOR){
    const any = EM.lz.some(e=>placedAt[e.id] && e.basiskonzepte_primaer.includes(bkid));
    if(!any) findings.push({sev:'advisory', text:`Basiskonzept "${EM.bkById[bkid].kurzbezeichnung}" hat noch kein eingeplantes Lernziel.`});
  }
  // 4. overloaded quarter (>18h)
  GRADES.forEach(g=>QUARTERS.forEach(q=>{
    const hrs = (plan()[cellKey(g,q)]||[]).reduce((s,id)=>s+(EM.lzById[id]?.geschaetzte_unterrichtsstunden||0),0);
    if(hrs>18) findings.push({sev:'advisory', text:`Klasse ${g}, ${q}: ${hrs}h geplant (Richtwert ~15h/Quartal überschritten).`});
  }));
  // 5. cross-grade coherence threads (kohaerenzfaeden.json) out of order
  for(const kf of EM.threads){
    const stations = kf.lernzielStationen.map(s=>({...s, at: placedAt[s.lernzielId]})).filter(s=>s.at);
    for(let i=1;i<stations.length;i++){
      if(stations[i].at.order < stations[i-1].at.order){
        findings.push({sev:'suggestion', text:`Kohärenzfaden "${kf.titel}": Station ${stations[i].lernzielId} liegt vor ${stations[i-1].lernzielId} — Fadenreihenfolge prüfen.`});
      }
    }
  }
  return findings;
}

function scoreFromFindings(findings){
  let score = 100;
  for(const f of findings) score -= f.sev==='critical'?14:(f.sev==='advisory'?5:2);
  return Math.max(0, score);
}

function cardChip(id){
  const e = EM.lzById[id]; if(!e) return '';
  return `<div class="chip" draggable="true" data-id="${esc(id)}" style="cursor:grab; background:${EM.BAND_META[e.band].color}22; border-color:${EM.BAND_META[e.band].color}66">${esc(id)}</div>`;
}

function render(){
  const host = document.getElementById('viewSequenz');
  const findings = computeFindings();
  const score = scoreFromFindings(findings);

  host.innerHTML = `
  <div style="display:flex; gap:8px; margin-bottom:14px; align-items:center; flex-wrap:wrap">
    <button class="pill-btn primary" id="btnAutoFill">⚡ Automatisch befüllen</button>
    <button class="pill-btn" id="btnClearPlan">🗑️ Plan leeren</button>
    <div style="margin-left:auto; display:flex; align-items:center; gap:10px">
      <div style="width:52px;height:52px;border-radius:50%;background:conic-gradient(${score>=80?'#16a34a':score>=55?'#d97706':'#e11d48'} ${score*3.6}deg, var(--bg-alt) 0); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px">${score}</div>
      <button class="pill-btn" id="btnExportSeq">⭳ Plan exportieren</button>
    </div>
  </div>
  <div style="display:grid; grid-template-columns:230px 1fr; gap:16px; align-items:start">
    <div class="card card-pad" style="max-height:75vh; overflow:auto">
      <div class="section-h">Nicht eingeplant</div>
      <input type="text" id="seqSearch" placeholder="Suchen…" style="width:100%; margin-bottom:8px">
      <div id="seqUnplaced" style="display:flex; flex-direction:column; gap:6px"></div>
    </div>
    <div>
      <div class="card" style="overflow:auto">
        <table style="border-collapse:collapse; width:100%">
          <tr><th style="width:70px"></th>${QUARTERS.map(q=>`<th style="padding:8px; font-size:12px; color:var(--txt-3); text-align:left">${q}</th>`).join('')}</tr>
          ${GRADES.map(g=>`<tr>
            <td style="padding:8px; font-weight:700; font-size:12.5px; color:var(--txt-2); border-top:1px solid var(--border)">Kl. ${g}</td>
            ${QUARTERS.map(q=>`<td class="seq-cell" data-g="${g}" data-q="${q}" style="border:1px dashed var(--border-2); border-radius:8px; padding:6px; vertical-align:top; min-width:150px; min-height:70px">
              <div style="display:flex; flex-wrap:wrap; gap:4px">${cellList(g,q).map(cardChip).join('')}</div>
            </td>`).join('')}
          </tr>`).join('')}
        </table>
      </div>
      <div class="section-h">Qualitätsanalyse (${findings.length} Hinweise)</div>
      <div style="display:flex; flex-direction:column; gap:6px">
        ${findings.length===0?'<div class="card card-pad" style="color:var(--green)">✓ Keine Befunde — Plan sieht stimmig aus.</div>':
          findings.map(f=>`<div class="card card-pad" style="border-left:4px solid ${f.sev==='critical'?'var(--rose)':f.sev==='advisory'?'var(--amber)':'var(--blue)'}; font-size:12.5px">${esc(f.text)}</div>`).join('')}
      </div>
    </div>
  </div>`;

  document.getElementById('seqUnplaced').innerHTML = unplacedList((document.getElementById('seqSearch').value||'').toLowerCase()).map(cardChip).join('');
  document.getElementById('btnAutoFill').onclick = autoFill;
  document.getElementById('btnClearPlan').onclick = () => { if(confirm('Gesamten Plan leeren?')) clearPlan(); };
  document.getElementById('btnExportSeq').onclick = () => {
    const payload = { erstellt:new Date().toISOString(), plan:plan(), befunde:findings, score };
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='sequenzplan.json'; a.click();
  };
  document.getElementById('seqSearch').oninput = (e) => { document.getElementById('seqUnplaced').innerHTML = unplacedList(e.target.value.toLowerCase()).map(cardChip).join(''); wireDrag(); };

  wireDrag();
}

function wireDrag(){
  document.querySelectorAll('.chip[draggable]').forEach(c=>{
    c.ondragstart = (e) => { e.dataTransfer.setData('text/plain', c.dataset.id); };
  });
  document.querySelectorAll('.seq-cell').forEach(cell=>{
    cell.ondragover = (e) => { e.preventDefault(); cell.style.background='var(--teal-pale)'; };
    cell.ondragleave = () => { cell.style.background=''; };
    cell.ondrop = (e) => {
      e.preventDefault(); cell.style.background='';
      const id = e.dataTransfer.getData('text/plain'); if(!id) return;
      for(const k in plan()) plan()[k] = plan()[k].filter(x=>x!==id);
      cellList(cell.dataset.g, cell.dataset.q).push(id);
      EM.saveState(); render();
    };
  });
}

EM.renderers.sequenz = render;
})();
</script>

<script>
/* =========================================================================
   VIEW: KI-Prompt-Generator — strukturierter Prompt zur Unterrichtsvorbereitung,
   gebaut aus den ausgewählten Lernzielen inkl. Evolutionsbezug/Didaktik.
   ========================================================================= */
(function(){
'use strict';
const esc = EM.esc;
const ALL_METHODEN = ['Forschendes Lernen','Analogien und Vergleiche','Konzeptuelles Lernen','Diskussion','Narrativer Zugang','Modelle und Simulationen','Erfahrungsbasiertes Lernen','Digitale Medien','Einblick in Wissenschaftsgeschichte','Recherche','Kooperative Lernformen','Projektbasiertes Lernen'];
const DIFFERENZIERUNG_OPTS = ['Basis- und Erweiterungsaufgaben','Sprachliche Differenzierung','Unterschiedliche Lerntempi'];
const BEWERTUNG_OPTS = ['Formative Beurteilung (laufend)','Quiz','Präsentationen, Poster, Flyer','Schriftliche Reflexion','Portfolio / Lerntagebuch','Klassenarbeit / LEK','Praktische Leistungen'];
const KONTEXT_OPTS = ['Biodiversitätskrise','Naturschutz und Arterhaltung','Klimawandel und Artenanpassung','Pandemien und Virusevolution','Gesundheit und evolutionäre Medizin','Antibiotikaresistenz','Psychische Gesundheit','Landwirtschaft und Lebensmittelherstellung','Biotechnologie und Gentechnik'];
const AUSGABE_OPTS = ['Vollständige Unterrichtssequenz mit Verlaufsplänen','Operationalisierte Lernziele pro Stunde','Methodische Vorschläge pro Stunde','Hinweise auf Materialien / Medien','Schülerfehlvorstellungen','Differenzierungsvorschläge','Transfer- und Diskussionsfragen','Querverbindungen zwischen Lernzielen'];
const VORWISSEN_OPTS = [['keins','Kein Vorwissen'],['grundlagen','Grundbegriffe bekannt'],['solide','Solides Grundwissen']];

const cfg = {
  scope:'favorites', thema:'', unterthema:'',
  customSelection: new Set(),
  picker:{ bands:new Set(['mnt56','gy78','gy910']), thema:'', unterthema:'', bk:'', q:'' },
  klassenstufe:'', stunden:4, stundenformat:'45', stundenformatAndere:'',
  selectedBks: new Set(EM.BK_ORDER), vorwissen:{},
  fachNotizen:'',
  methodenExtra:new Set(), differenzierung:new Set(), didNotizen:'',
  bewertung:new Set(['Formative Beurteilung (laufend)']), evalNotizen:'',
  kontext:new Set(), kontextNotizen:'',
  ausgabeTyp:new Set(['Vollständige Unterrichtssequenz mit Verlaufsplänen','Methodische Vorschläge pro Stunde','Transfer- und Diskussionsfragen']),
  ton:'professionell', laenge:'ausführlich', sonstigeNotizen:'',
};
for(const id of EM.BK_ORDER) cfg.vorwissen[id]='grundlagen';

function scopeEntries(){
  if(cfg.scope==='thema') return EM.lz.filter(e=>e.thema===cfg.thema);
  if(cfg.scope==='unterthema') return EM.lz.filter(e=>e.unterthema===cfg.unterthema);
  if(cfg.scope==='auswahl') return EM.lz.filter(e=>cfg.customSelection.has(e.id));
  return EM.lz.filter(e=>EM.isFav(e.id));
}

function pickerCandidates(){
  const p = cfg.picker;
  return EM.lz.filter(e=>{
    if(!p.bands.has(e.band)) return false;
    if(p.thema && e.thema!==p.thema) return false;
    if(p.unterthema && e.unterthema!==p.unterthema) return false;
    if(p.bk && (EM.bkBezug(e,p.bk)?.relevanz_beurteilung||0)<2) return false;
    if(p.q && !(e.id+' '+e.kurzbezeichnung+' '+e.originaltext).toLowerCase().includes(p.q.toLowerCase())) return false;
    return true;
  });
}

function buildPrompt(){
  const entries = scopeEntries();
  const lines = [];
  lines.push('='.repeat(70));
  lines.push('UNTERRICHTSVORBEREITUNG MIT BASISKONZEPT-INTEGRATION');
  lines.push('='.repeat(70));
  lines.push('');
  lines.push('Du bist eine erfahrene Biologie-Lehrkraft und Fachdidaktikerin. Erstelle');
  lines.push('auf Basis der folgenden Lernziele eine konkrete Unterrichtsplanung, die');
  lines.push('die unten genannten Basiskonzepte gezielt einbindet, ohne den Kernlehrplan');
  lines.push('zu verlassen.');
  lines.push('');
  const format = cfg.stundenformat==='other' ? (cfg.stundenformatAndere||'?') : cfg.stundenformat;
  lines.push(`Klassenstufe(n): ${cfg.klassenstufe || '(siehe Lernziele)'}    Unterrichtsstunden: ${cfg.stunden} × ${format} Min.`);
  lines.push('');
  lines.push('BASISKONZEPTBEZUG & VORWISSEN:');
  for(const bkId of EM.BK_ORDER){
    if(!cfg.selectedBks.has(bkId)) continue;
    const bk = EM.bkById[bkId];
    const vw = VORWISSEN_OPTS.find(v=>v[0]===cfg.vorwissen[bkId]);
    lines.push(`- ${bk?bk.bezeichnung:bkId}: ${vw?vw[1]:'unbekannt'}`);
  }
  if(cfg.fachNotizen) lines.push(`Zusätzliche fachliche Schwerpunkte: ${cfg.fachNotizen}`);
  lines.push('');
  lines.push(`LERNZIELE (${entries.length}):`);
  lines.push('-'.repeat(70));
  for(const e of entries){
    lines.push(`\n[${e.id}] ${e.kurzbezeichnung} (${EM.BAND_META[e.band].label})`);
    lines.push(`  Wortlaut: ${e.originaltext}`);
    for(const bkId of EM.BK_ORDER){
      if(!cfg.selectedBks.has(bkId)) continue;
      const b = EM.bkBezug(e, bkId); if(!b) continue;
      const tkNames = (b.relevante_teilkonzepte||[]).map(id=>(EM.tkById[id]&&EM.tkById[id].bezeichnung)||id);
      lines.push(`  ${EM.bkById[bkId]?EM.bkById[bkId].kurzbezeichnung:bkId} (Relevanz ${b.relevanz_beurteilung}/3): ${b.begruendung}`);
      if(tkNames.length) lines.push(`    Unterkonzepte: ${tkNames.join(', ')}`);
      if(bkId==='bk_evolutive_entwicklung' && (b.relevante_evolutionskonzepte||[]).length) lines.push(`    Evolutionskonzepte: ${b.relevante_evolutionskonzepte.join(', ')}`);
      if((b.relevante_unterkonzepte||[]).length) lines.push(`    Unterkonzepte (erweitert): ${b.relevante_unterkonzepte.join(', ')}`);
    }
    if(e.didaktische_strategien){
      const ds = e.didaktische_strategien;
      const mf = EM.ann(e.id).methFavs||{};
      const favM = ds.top3_methoden.filter(m=>mf[m.rang]);
      const useM = favM.length?favM:ds.top3_methoden;
      lines.push(`  Leitfrage: ${ds.evolutionsdidaktischer_impuls}`);
      lines.push(`  Methoden${favM.length?' (favorisiert)':''}: ${useM.map(m=>m.methode).join(', ')}`);
      lines.push(`  Fehlvorstellungen: ${ds.moegliche_fehlvorstellungen}`);
    }
    const a = EM.ann(e.id);
    if(a.notizen) lines.push(`  Meine Notiz: ${a.notizen}`);
  }
  lines.push('');
  lines.push('-'.repeat(70));
  if(cfg.methodenExtra.size) lines.push(`WEITERE METHODEN: ${[...cfg.methodenExtra].join(', ')}`);
  if(cfg.differenzierung.size) lines.push(`DIFFERENZIERUNG: ${[...cfg.differenzierung].join(', ')}`);
  if(cfg.didNotizen) lines.push(`Didaktische Hinweise: ${cfg.didNotizen}`);
  if(cfg.bewertung.size) lines.push(`EVALUATION: ${[...cfg.bewertung].join(', ')}`);
  if(cfg.evalNotizen) lines.push(`Hinweise zur Evaluation: ${cfg.evalNotizen}`);
  if(cfg.kontext.size) lines.push(`GESELLSCHAFTLICHE BEZÜGE: ${[...cfg.kontext].join(', ')}`);
  if(cfg.kontextNotizen) lines.push(`Weitere Hinweise: ${cfg.kontextNotizen}`);
  lines.push('');
  lines.push('GEWÜNSCHTE AUSGABE:');
  lines.push(`- Ton: ${cfg.ton}, Länge: ${cfg.laenge}`);
  if(cfg.ausgabeTyp.size) for(const t of cfg.ausgabeTyp) lines.push(`- ${t}`);
  if(cfg.sonstigeNotizen) lines.push(`- Sonstige Hinweise: ${cfg.sonstigeNotizen}`);
  return lines.join('\n');
}

function radioChips(groupClass, opts, current){
  return `<div class="radio-group ${groupClass}" style="display:flex; flex-wrap:wrap; gap:6px">${opts.map(([v,l])=>`<span class="radio-chip ${current===v?'selected':''}" data-val="${esc(v)}">${esc(l)}</span>`).join('')}</div>`;
}
function checkGroup(groupClass, opts, setRef){
  return `<div class="check-group ${groupClass}">${opts.map(o=>`<label class="check-item"><input type="checkbox" value="${esc(o)}" ${setRef.has(o)?'checked':''}> ${esc(o)}</label>`).join('')}</div>`;
}

  const themen = Array.from(new Set(EM.lz.map(e=>e.thema)));

  host.innerHTML = `

  </style>
  <div class="pg-grid" style="margin-bottom:14px">

        <select id="cScope">
          <option value="favorites" ${cfg.scope==='favorites'?'selected':''}>Meine Favoriten (★)</option>
          <option value="thema" ${cfg.scope==='thema'?'selected':''}>Ein Thema</option>
          <option value="unterthema" ${cfg.scope==='unterthema'?'selected':''}>Ein Unterthema</option>
          <option value="auswahl" ${cfg.scope==='auswahl'?'selected':''}>Eigene Auswahl (über Themen hinweg)</option>
        </select>

    <div class="card card-pad">

      <div class="pg-field"><label>Klassenstufe(n)</label><input type="text" id="cKlasse" value="${esc(cfg.klassenstufe)}" placeholder="z. B. 7 oder 7–8"></div>

      <div class="pg-field"><label>Stundenformat</label>${radioChips('rc-format', [['45','45 Min.'],['60','60 Min.'],['90','90 Min.'],['other','Andere']], cfg.stundenformat)}
        ${cfg.stundenformat==='other'?`<input type="number" id="cFormatAndere" value="${esc(cfg.stundenformatAndere)}" placeholder="Minuten" style="margin-top:6px">`:''}
      </div>
    </div>
  </div>
  <div class="pg-grid" style="margin-bottom:14px">
    <div class="card card-pad">
      <div class="pg-section-title"><span class="pg-num">3</span> Basiskonzeptbezug &amp; Vorwissen</div>
      <div class="pg-field"><label>Einbezogene Basiskonzepte</label>
        <div style="display:flex; flex-wrap:wrap; gap:6px" id="bkChips">${EM.BK_ORDER.map(id=>`<span class="radio-chip bk-chip ${cfg.selectedBks.has(id)?'selected':''}" data-bk="${id}"><span class="badge-dot" style="background:${EM.BK_COLOR[id]}"></span> ${esc(EM.bkById[id]?EM.bkById[id].kurzbezeichnung:id)}</span>`).join('')}</div>
      </div>
      <div id="vorwissenList"></div>
    </div>
    <div class="card card-pad">
      <div class="pg-section-title"><span class="pg-num">4</span> Wissenschaftlich-konzeptueller Fokus</div>
      <div class="pg-field"><label>Zusätzliche fachliche Schwerpunkte</label><textarea id="cFachNotizen" placeholder="z. B. Schwerpunkt auf molekulare Belege…">${esc(cfg.fachNotizen)}</textarea></div>
    </div>
  </div>
  <div class="pg-grid" style="margin-bottom:14px">
    <div class="card card-pad">
      <div class="pg-section-title"><span class="pg-num">5</span> Didaktische Methoden</div>
      <div class="pg-field"><label>Weitere Methoden</label>${checkGroup('cg-methoden', ALL_METHODEN, cfg.methodenExtra)}</div>
      <div class="pg-field"><label>Differenzierung</label>${checkGroup('cg-diff', DIFFERENZIERUNG_OPTS, cfg.differenzierung)}</div>
      <div class="pg-field"><label>Didaktische Hinweise</label><textarea id="cDidNotizen" placeholder="z. B. kein Labor vorhanden…">${esc(cfg.didNotizen)}</textarea></div>
    </div>
    <div class="card card-pad">
      <div class="pg-section-title"><span class="pg-num">6</span> Evaluation und Leistungserhebung</div>
      <div class="pg-field">${checkGroup('cg-bewertung', BEWERTUNG_OPTS, cfg.bewertung)}</div>
      <div class="pg-field"><textarea id="cEvalNotizen" placeholder="Weitere Hinweise zur Evaluation…">${esc(cfg.evalNotizen)}</textarea></div>
    </div>
  </div>
  <div class="pg-grid" style="margin-bottom:14px">
    <div class="card card-pad">
      <div class="pg-section-title"><span class="pg-num">7</span> Gesellschaftliche Bezüge</div>
      <div class="pg-field">${checkGroup('cg-kontext', KONTEXT_OPTS, cfg.kontext)}</div>
      <div class="pg-field"><textarea id="cKontextNotizen" placeholder="Weitere Hinweise…">${esc(cfg.kontextNotizen)}</textarea></div>
    </div>
    <div class="card card-pad">
      <div class="pg-section-title"><span class="pg-num">8</span> Ausgabeformat</div>
      <div class="pg-field"><label>KI soll erstellen</label>${checkGroup('cg-ausgabe', AUSGABE_OPTS, cfg.ausgabeTyp)}</div>
      <div class="pg-field"><label>Ton</label>${radioChips('rc-ton', [['akademisch','Akademisch'],['professionell','Professionell'],['praxisnah','Praxisnah']], cfg.ton)}</div>
      <div class="pg-field"><label>Länge</label>${radioChips('rc-laenge', [['kurz','Kompakt'],['mittel','Ausführlich'],['ausführlich','Sehr ausführlich']], cfg.laenge)}</div>
      <div class="pg-field"><label>Sonstige Hinweise</label><textarea id="cSonstigeNotizen" placeholder="z. B. Antworte auf Deutsch…">${esc(cfg.sonstigeNotizen)}</textarea></div>
    </div>
  </div>
  <div class="card card-pad">
    <div style="display:flex; align-items:center; margin-bottom:8px">
      <b style="font-size:13px">Generierter Prompt</b>
      <div style="flex:1"></div>
      <button class="pill-btn" id="btnCopyPrompt">📋 Kopieren</button>
      <button class="pill-btn primary" id="btnDlPrompt" style="margin-left:6px">⭳ Herunterladen</button>
    </div>
    <textarea id="promptOut" readonly style="width:100%; height:50vh; font-family:ui-monospace,monospace; font-size:11.5px"></textarea>
  </div>`;

  function renderPicker(){
    const sub = document.getElementById('scopeSub');
    const p = cfg.picker;
    const candidates = pickerCandidates();
    const selected = EM.lz.filter(e=>cfg.customSelection.has(e.id));
    sub.innerHTML = `
      <div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px">
        ${Object.entries(EM.BAND_META).map(([b,m])=>`<span class="chip ${p.bands.has(b)?'on':''}" data-pband="${b}" style="font-size:11px">${m.label}</span>`).join('')}
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px">
        <select id="pThema" style="font-size:12px"><option value="">Alle Themen</option>${themen.map(t=>`<option ${p.thema===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
        <select id="pUnterthema" style="font-size:12px"><option value="">Alle Unterthemen</option>${Array.from(new Set(EM.lz.filter(e=>!p.thema||e.thema===p.thema).map(e=>e.unterthema).filter(Boolean))).map(t=>`<option ${p.unterthema===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
      </div>
      <select id="pBk" style="width:100%; font-size:12px; margin-bottom:6px">
        <option value="">Konzeptueller Fokus: alle</option>
        ${EM.BK_ORDER.map(id=>`<option value="${id}" ${p.bk===id?'selected':''}>${esc(EM.bkById[id]?EM.bkById[id].bezeichnung:id)} (≥ mittlere Relevanz)</option>`).join('')}
      </select>
      <input type="text" id="pSearch" placeholder="Suchen…" value="${esc(p.q)}" style="width:100%; margin-bottom:8px">
      <div style="max-height:220px; overflow:auto; border:1px solid var(--border); border-radius:8px; padding:6px" id="pickerList">
        ${candidates.slice(0,150).map(e=>`<label style="display:flex; align-items:flex-start; gap:6px; font-size:11.5px; padding:3px 0; cursor:pointer">
          <input type="checkbox" data-pick="${esc(e.id)}" ${cfg.customSelection.has(e.id)?'checked':''}>
          <span><b>${esc(e.id)}</b> · ${esc(e.kurzbezeichnung)} <span style="color:var(--txt-3)">(${EM.BAND_META[e.band].label})</span></span>
        </label>`).join('') || '<div style="color:var(--txt-3); font-size:12px">Keine Treffer.</div>'}
        ${candidates.length>150?`<div style="color:var(--txt-3); font-size:11px; margin-top:4px">+${candidates.length-150} weitere Treffer — Suche/Filter eingrenzen.</div>`:''}
      </div>
      <div class="section-h">Ausgewählt (${selected.length})</div>
      <div style="display:flex; flex-wrap:wrap; gap:5px">
        ${selected.map(e=>`<span class="chip" data-unpick="${esc(e.id)}" style="cursor:pointer">${esc(e.id)} ✕</span>`).join('') || '<span style="color:var(--txt-3); font-size:12px">Noch keine Lernziele ausgewählt.</span>'}
      </div>`;
    sub.querySelectorAll('[data-pband]').forEach(c=>c.onclick=()=>{ const b=c.dataset.pband; p.bands.has(b)?p.bands.delete(b):p.bands.add(b); refresh(); });
    document.getElementById('pThema').onchange = e => { p.thema = e.target.value; p.unterthema=''; refresh(); };
    document.getElementById('pUnterthema').onchange = e => { p.unterthema = e.target.value; refresh(); };
    document.getElementById('pBk').onchange = e => { p.bk = e.target.value; refresh(); };
    document.getElementById('pSearch').oninput = e => { p.q = e.target.value; refresh(); };
    sub.querySelectorAll('[data-pick]').forEach(cb=>cb.onchange=()=>{ cb.checked?cfg.customSelection.add(cb.dataset.pick):cfg.customSelection.delete(cb.dataset.pick); refresh(); });
    sub.querySelectorAll('[data-unpick]').forEach(c=>c.onclick=()=>{ cfg.customSelection.delete(c.dataset.unpick); refresh(); });
  }

  function renderScopeSub(){
    const sub = document.getElementById('scopeSub');
    if(cfg.scope==='thema'){
      sub.innerHTML = `<div class="pg-field"><select id="cThema"><option value="">– wählen –</option>${themen.map(t=>`<option ${cfg.thema===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
      document.getElementById('cThema').onchange = e => { cfg.thema = e.target.value; refresh(); };
    } else if(cfg.scope==='unterthema'){
      const unterthemen = Array.from(new Set(EM.lz.map(e=>e.unterthema).filter(Boolean)));
      sub.innerHTML = `<div class="pg-field"><select id="cUnterthema"><option value="">– wählen –</option>${unterthemen.map(t=>`<option ${cfg.unterthema===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
      document.getElementById('cUnterthema').onchange = e => { cfg.unterthema = e.target.value; refresh(); };
    } else if(cfg.scope==='auswahl'){
      renderPicker();
    } else { sub.innerHTML = `<div style="font-size:12px; color:var(--txt-3)">${scopeEntries().length} Favoriten aktuell markiert.</div>`; }
  }

  function renderVorwissen(){
    const host2 = document.getElementById('vorwissenList');
    host2.innerHTML = EM.BK_ORDER.filter(id=>cfg.selectedBks.has(id)).map(id=>`
      <div class="pg-field"><label>${esc(EM.bkById[id]?EM.bkById[id].bezeichnung:id)} — Vorwissen</label>${radioChips('rc-vw-'+id, VORWISSEN_OPTS, cfg.vorwissen[id])}</div>
    `).join('');
    host2.querySelectorAll('[class*="rc-vw-"] .radio-chip').forEach(c=>c.onclick=()=>{
      const bkId = c.closest('[class*="rc-vw-"]').className.match(/rc-vw-(\S+)/)[1];
      cfg.vorwissen[bkId] = c.dataset.val; refresh();
    });
  }

  function wireChipGroup(sel, onSelect){
    host.querySelectorAll(sel+' .radio-chip').forEach(c=>c.onclick=()=>{
      host.querySelectorAll(sel+' .radio-chip').forEach(x=>x.classList.remove('selected'));
      c.classList.add('selected');
      onSelect(c.dataset.val);
      refresh();
    });
  }
  function wireCheckGroup(sel, setRef){
    host.querySelectorAll(sel+' input[type=checkbox]').forEach(cb=>cb.onchange=()=>{
      if(cb.checked) setRef.add(cb.value); else setRef.delete(cb.value);
      refresh();
    });
  }

  function refresh(){
    document.getElementById('promptOut').value = buildPrompt();
    renderScopeSub();
    renderVorwissen();
  }

  document.getElementById('cScope').onchange = e => { cfg.scope = e.target.value; refresh(); };
  document.getElementById('cKlasse').oninput = e => { cfg.klassenstufe = e.target.value; refresh(); };
  document.getElementById('cStunden').oninput = e => { cfg.stunden = +e.target.value; refresh(); };
  wireChipGroup('.rc-format', v=>{ cfg.stundenformat = v; });
  const fa = document.getElementById('cFormatAndere'); if(fa) fa.oninput = e => { cfg.stundenformatAndere = e.target.value; refresh(); };
  host.querySelectorAll('#bkChips .bk-chip').forEach(c=>c.onclick=()=>{
    const id = c.dataset.bk;
    if(cfg.selectedBks.has(id)) cfg.selectedBks.delete(id); else cfg.selectedBks.add(id);
    c.classList.toggle('selected');
    refresh();
  });
  document.getElementById('cFachNotizen').oninput = e => { cfg.fachNotizen = e.target.value; refresh(); };
  wireCheckGroup('.cg-methoden', cfg.methodenExtra);
  wireCheckGroup('.cg-diff', cfg.differenzierung);
  document.getElementById('cDidNotizen').oninput = e => { cfg.didNotizen = e.target.value; refresh(); };
  wireCheckGroup('.cg-bewertung', cfg.bewertung);
  document.getElementById('cEvalNotizen').oninput = e => { cfg.evalNotizen = e.target.value; refresh(); };
  wireCheckGroup('.cg-kontext', cfg.kontext);
  document.getElementById('cKontextNotizen').oninput = e => { cfg.kontextNotizen = e.target.value; refresh(); };
  wireCheckGroup('.cg-ausgabe', cfg.ausgabeTyp);
  wireChipGroup('.rc-ton', v=>{ cfg.ton = v; });
  wireChipGroup('.rc-laenge', v=>{ cfg.laenge = v; });
  document.getElementById('cSonstigeNotizen').oninput = e => { cfg.sonstigeNotizen = e.target.value; refresh(); };

  document.getElementById('btnCopyPrompt').onclick = () => { navigator.clipboard.writeText(document.getElementById('promptOut').value).then(()=>EM.toast('In Zwischenablage kopiert')); };
  document.getElementById('btnDlPrompt').onclick = () => {
    const blob = new Blob([document.getElementById('promptOut').value],{type:'text/plain'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ki_prompt.txt'; a.click();
  };
  renderScopeSub();
  renderVorwissen();
  document.getElementById('promptOut').value = buildPrompt();
}

EM.renderers.prompt = render;
})();
</script>

<script>
/* =========================================================================
   VIEW: Forschungs-Dashboard — Datenqualität, Abdeckung, Konsistenz.
   Für Bildungsdesign-Forschende und Lehramtsstudierende, die den Datensatz
   selbst als Untersuchungsgegenstand nutzen (Konsistenzprüfungen, Coverage).
   ========================================================================= */
(function(){
'use strict';
const esc = EM.esc;

function computeReport(){
  const lz = EM.lz;
  const ids = new Set(lz.map(e=>e.id));
  const dangling = [];
  for(const e of lz){
    for(const r of (e.voraussetzende_lernziele||[])) if(!ids.has(r)) dangling.push({from:e.id, to:r, kind:'voraussetzende_lernziele'});
    for(const r of (e.ermoeglichende_lernziele||[])) if(!ids.has(r)) dangling.push({from:e.id, to:r, kind:'ermoeglichende_lernziele'});
  }
  const byBand = {};
  for(const b in EM.BAND_META){
    const list = lz.filter(e=>e.band===b);
    const withEvo = list.filter(e=>EM.evoBezug(e));
    byBand[b] = {
      total:list.length,
      withEvo:withEvo.length,
      pctEvo: list.length ? Math.round(withEvo.length/list.length*100) : 0,
      avgRelevance: withEvo.length ? (withEvo.reduce((s,e)=>s+EM.evoBezug(e).relevanz_beurteilung,0)/withEvo.length).toFixed(2) : '–',
      praktisch: list.filter(e=>e.ist_praktisch).length,
      anker: list.filter(e=>e.ist_konzeptanker).length,
    };
  }
  // evolutionskonzepte usage frequency (gap detection: unused concepts)
  const usage = {};
  for(const ek of EM.data.evolutionskonzepte.evolutionskonzepte) usage[ek.bezeichnung] = 0;
  for(const e of lz){ const eb = EM.evoBezug(e); if(eb) for(const k of eb.relevante_evolutionskonzepte||[]){
    if(k in usage) usage[k]++; else usage['__unrecognized__:'+k] = (usage['__unrecognized__:'+k]||0)+1;
  } }
  const unused = Object.entries(usage).filter(([k,v])=>v===0 && !k.startsWith('__unrecognized__'));
  const unrecognized = Object.entries(usage).filter(([k])=>k.startsWith('__unrecognized__'));

  // BK tag balance
  const bkCounts = {}; for(const id in EM.BK_COLOR) bkCounts[id]=0;
  for(const e of lz) for(const b of e.basiskonzepte_primaer) if(b in bkCounts) bkCounts[b]++;

  // duplicate ids
  const seen = new Set(); const dupes = [];
  for(const e of lz){ if(seen.has(e.id)) dupes.push(e.id); seen.add(e.id); }

  // kohaerenzfaeden resolution
  let kfStations=0, kfResolved=0;
  for(const kf of EM.threads) for(const s of kf.lernzielStationen){ kfStations++; if(ids.has(s.lernzielId)) kfResolved++; }

  return { total:lz.length, byBand, dangling, unused, unrecognized, bkCounts, dupes, kfStations, kfResolved, threadCount:EM.threads.length };
}

function render(){
  const host = document.getElementById('viewForschung');
  const r = computeReport();
  host.innerHTML = `
  <p style="color:var(--txt-2); font-size:12.5px; margin-bottom:14px">Automatisierte Konsistenz- und Abdeckungsprüfungen über den gesamten Datensatz — als Ausgangspunkt für eigene Forschungsfragen zur Datenqualität, nicht als Ersatz für eine fachdidaktische Prüfung.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin-bottom:16px">
    <div class="kpi"><div class="n">${r.total}</div><div class="l">Lernziele gesamt</div></div>
    <div class="kpi"><div class="n" style="color:${r.dangling.length?'var(--rose)':'var(--green)'}">${r.dangling.length}</div><div class="l">hängende Referenzen</div></div>
    <div class="kpi"><div class="n" style="color:${r.dupes.length?'var(--rose)':'var(--green)'}">${r.dupes.length}</div><div class="l">Doppelte IDs</div></div>
    <div class="kpi"><div class="n">${r.kfResolved}/${r.kfStations}</div><div class="l">Kohärenzfaden-Stationen aufgelöst</div></div>
    <div class="kpi"><div class="n">${r.unused.length}</div><div class="l">unbenutzte Evolutionskonzepte</div></div>
    <div class="kpi"><div class="n" style="color:${r.unrecognized.length?'var(--rose)':'var(--green)'}">${r.unrecognized.length}</div><div class="l">nicht erkannte Konzeptbegriffe</div></div>
  </div>

  <div class="section-h">Abdeckung je Klassenstufe</div>
  <div class="card" style="overflow:auto; margin-bottom:16px">
    <table style="width:100%; border-collapse:collapse; font-size:12.5px">
      <tr style="text-align:left; color:var(--txt-3)"><th style="padding:8px">Klassenstufe</th><th>Lernziele</th><th>mit Evolutionsbezug</th><th>Ø Relevanz</th><th>praktisch</th><th>Konzeptanker</th></tr>
      ${Object.entries(r.byBand).map(([b,s])=>`<tr style="border-top:1px solid var(--border)">
        <td style="padding:8px"><b>${EM.BAND_META[b].label}</b></td>
        <td>${s.total}</td><td>${s.withEvo} (${s.pctEvo}%)</td><td>${s.avgRelevance}</td><td>${s.praktisch}</td><td>${s.anker}</td>
      </tr>`).join('')}
    </table>
  </div>

  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="card card-pad">
      <div class="section-h">Basiskonzept-Balance</div>
      ${Object.entries(r.bkCounts).map(([id,n])=>`<div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px"><span>${esc(EM.bkById[id]?.kurzbezeichnung||id)}</span><b>${n}</b></div>`).join('')}
    </div>
    <div class="card card-pad">
      <div class="section-h">Auffälligkeiten</div>
      ${r.dangling.length?`<div style="font-size:12px; color:var(--rose); margin-bottom:8px">${r.dangling.slice(0,8).map(d=>`${esc(d.from)} → ${esc(d.to)} (${d.kind})`).join('<br>')}</div>`:'<div style="font-size:12.5px; color:var(--green)">✓ Keine hängenden Referenzen.</div>'}
      ${r.unrecognized.length?`<div style="font-size:12px; color:var(--amber)">Nicht erkannte Konzeptbegriffe: ${r.unrecognized.map(([k,v])=>`${esc(k.replace('__unrecognized__:',''))} (${v}×)`).join(', ')}</div>`:''}
    </div>
  </div>
  <div class="card card-pad" style="margin-top:14px">
    <div class="section-h">Unbenutzte Evolutionskonzepte (Kandidaten für gezielte Anreicherung)</div>
    <div style="display:flex; flex-wrap:wrap; gap:6px">${r.unused.map(([k])=>`<span class="chip" style="cursor:default">${esc(k)}</span>`).join('') || '<span style="color:var(--txt-3); font-size:12.5px">Alle Konzepte werden mindestens einmal referenziert.</span>'}</div>
  </div>
  <div style="margin-top:14px">
    <button class="pill-btn primary" id="btnExportReport">⭳ Forschungsbericht als JSON exportieren</button>
  </div>`;

  document.getElementById('btnExportReport').onclick = () => {
    const blob = new Blob([JSON.stringify({erstellt:new Date().toISOString(), bericht:r}, null, 2)],{type:'application/json'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='forschungsbericht.json'; a.click();
  };
}

EM.renderers.forschung = render;
})();
</script>
</body>
