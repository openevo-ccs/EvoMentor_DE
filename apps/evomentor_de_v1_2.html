<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvoMentor DE v1.2 — Integriertes Lehrplan- und Evolutionswerkzeug</title>
<style>
:root{
  --bg:#f4f6fb; --bg-alt:#eef1f8; --panel:#ffffff; --panel-2:#f8f9fd;
  --border:#e0e4ee; --border-2:#cbd2e3;
  --txt:#0f172a; --txt-2:#475569; --txt-3:#8592ab;
  --teal:#0d9488; --teal-pale:#e6f7f5;
  --blue:#2563eb; --blue-pale:#e8effe;
  --purple:#7c3aed; --purple-pale:#f2eafe;
  --amber:#d97706; --amber-pale:#fdf1e0;
  --rose:#e11d48; --rose-pale:#fce8ed;
  --green:#16a34a; --green-pale:#e8f7ec;
  --shadow: 0 1px 2px rgba(15,23,42,.04), 0 6px 20px -6px rgba(15,23,42,.10);
  --shadow-lg: 0 12px 40px -12px rgba(15,23,42,.22);
  --radius: 12px; --radius-sm: 8px;
  --sidebar-w: 250px;
  --bk-struktur:#2563eb; --bk-stoff:#d97706; --bk-info:#7c3aed; --bk-steuerung:#64748b;
  --bk-individuell:#e11d48; --bk-evolutiv:#16a34a;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
:root[data-theme="dark"], :root:not([data-theme="light"]){
  --scheme-auto: 1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --bg-alt:#0e1626; --panel:#121b2d; --panel-2:#16213610;
    --panel-2:#16213a; --border:#233150; --border-2:#2c3c60;
    --txt:#e6ebf5; --txt-2:#aab6cc; --txt-3:#7686a3;
    --teal-pale:#0d3733; --blue-pale:#152a52; --purple-pale:#2c1f4d; --amber-pale:#3a2a0e; --rose-pale:#3a1420; --green-pale:#123822;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px -6px rgba(0,0,0,.5);
    --shadow-lg: 0 16px 48px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --bg-alt:#0e1626; --panel:#121b2d; --panel-2:#16213a; --border:#233150; --border-2:#2c3c60;
  --txt:#e6ebf5; --txt-2:#aab6cc; --txt-3:#7686a3;
  --teal-pale:#0d3733; --blue-pale:#152a52; --purple-pale:#2c1f4d; --amber-pale:#3a2a0e; --rose-pale:#3a1420; --green-pale:#123822;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px -6px rgba(0,0,0,.5);
  --shadow-lg: 0 16px 48px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--txt);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
a{color:var(--blue)}
button{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- App shell ---------- */
#app{display:flex; height:100vh; overflow:hidden}

/* Sidebar */
#sidebar{
  width:var(--sidebar-w); flex:0 0 auto; background:var(--panel); border-right:1px solid var(--border);
  display:flex; flex-direction:column; transition:width .18s ease, transform .18s ease;
}
#sidebar.collapsed{width:64px}
.brand{
  display:flex; align-items:center; gap:10px; padding:16px 16px 14px 16px; border-bottom:1px solid var(--border);
}
.brand-mark{
  width:34px;height:34px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--teal),var(--blue) 55%,var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:17px;
}
.brand-text{overflow:hidden}
.brand-text b{display:block;font-size:14.5px;letter-spacing:.2px;white-space:nowrap}
.brand-text span{display:block;font-size:10.5px;color:var(--txt-3);white-space:nowrap}
#sidebar.collapsed .brand-text{display:none}

nav.viewnav{flex:1; overflow-y:auto; padding:10px 10px}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px; cursor:pointer;
  color:var(--txt-2); font-size:13.3px; font-weight:500; margin-bottom:2px; white-space:nowrap;
  border:1px solid transparent;
}
.nav-item:hover{background:var(--bg-alt); color:var(--txt)}
.nav-item.active{background:var(--teal-pale); color:var(--teal); border-color:color-mix(in srgb, var(--teal) 25%, transparent)}
.nav-item .ic{width:19px; text-align:center; flex:0 0 auto; font-size:15px}
#sidebar.collapsed .nav-item span.lbl{display:none}
.nav-section-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--txt-3); padding:14px 11px 5px}
#sidebar.collapsed .nav-section-label{display:none}

.sidebar-foot{padding:10px; border-top:1px solid var(--border); display:flex; gap:6px}
.icon-btn{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--border); background:var(--panel-2);
  color:var(--txt-2); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px;
}
.icon-btn:hover{background:var(--bg-alt); color:var(--txt)}

/* Main area */
#main{flex:1; display:flex; flex-direction:column; min-width:0}
#topbar{
  height:56px; flex:0 0 auto; border-bottom:1px solid var(--border); background:var(--panel);
  display:flex; align-items:center; gap:12px; padding:0 18px;
}
#topbar h1{font-size:15.5px; margin:0; font-weight:650}
#topbar .sub{color:var(--txt-3); font-size:12px}
.topbar-spacer{flex:1}
.searchbox{
  display:flex; align-items:center; gap:7px; background:var(--bg-alt); border:1px solid var(--border);
  border-radius:9px; padding:6px 11px; min-width:230px;
}
.searchbox input{border:0; background:transparent; outline:0; font-size:13px; color:var(--txt); width:100%}
.pill-btn{
  border:1px solid var(--border-2); background:var(--panel); color:var(--txt-2); border-radius:8px;
  padding:6px 12px; font-size:12.5px; cursor:pointer; font-weight:600; display:flex; align-items:center; gap:6px;
}
.pill-btn:hover{background:var(--bg-alt)}
.pill-btn.primary{background:var(--teal); border-color:var(--teal); color:#fff}
.pill-btn.primary:hover{filter:brightness(1.06)}

#viewport{flex:1; overflow:auto; position:relative}
.view{display:none; padding:20px 22px 40px; max-width:1500px; margin:0 auto}
.view.active{display:block}
.view-loading, .view-empty{padding:60px 20px; text-align:center; color:var(--txt-3)}

/* Generic building blocks */
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow)}
.card-pad{padding:16px 18px}
.grid{display:grid; gap:14px}
.kpi{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px}
.kpi .n{font-size:24px; font-weight:750; letter-spacing:-.02em}
.kpi .l{font-size:11.5px; color:var(--txt-3); margin-top:2px}
.tag{
  display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:650; padding:3px 8px;
  border-radius:100px; border:1px solid transparent; white-space:nowrap;
}
.badge-dot{width:7px;height:7px;border-radius:50%; display:inline-block}
.chip{
  display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border-2); background:var(--panel);
  color:var(--txt-2); border-radius:100px; padding:4px 10px; font-size:12px; cursor:pointer; user-select:none;
}
.chip:hover{background:var(--bg-alt)}
.chip.on{background:var(--teal); border-color:var(--teal); color:#fff}
.section-h{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--txt-3); margin:18px 0 8px}
.section-h:first-child{margin-top:0}
hr.sep{border:0;border-top:1px solid var(--border); margin:16px 0}

textarea, input[type=text], input[type=number], select{
  font-family:inherit; font-size:13px; border:1px solid var(--border-2); border-radius:8px; padding:7px 9px;
  background:var(--panel); color:var(--txt);
}

/* Modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(10,15,25,.45); display:none; align-items:center; justify-content:center; z-index:200}
.modal-backdrop.open{display:flex}
.modal{background:var(--panel); border-radius:14px; box-shadow:var(--shadow-lg); width:min(640px,92vw); max-height:85vh; overflow:auto; border:1px solid var(--border)}
.modal-head{display:flex; align-items:center; padding:16px 18px; border-bottom:1px solid var(--border)}
.modal-head h3{margin:0; font-size:15px}
.modal-body{padding:16px 18px}
.modal-foot{padding:12px 18px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px}

/* Toast */
#toastwrap{position:fixed; bottom:18px; right:18px; z-index:300; display:flex; flex-direction:column; gap:8px}
.toast{background:var(--txt); color:var(--bg); padding:9px 14px; border-radius:9px; font-size:12.5px; box-shadow:var(--shadow-lg); opacity:0; transform:translateY(6px); transition:.2s}
.toast.show{opacity:1; transform:none}

/* Mobile */
@media (max-width:880px){
  #sidebar{position:fixed; z-index:150; height:100%; transform:translateX(-100%)}
  #sidebar.mobile-open{transform:none}
  .searchbox{min-width:120px}
  #btnMobileNav{display:flex !important}
  #sidebarScrim{display:none; position:fixed; inset:0; background:rgba(10,15,25,.4); z-index:140}
  #sidebarScrim.show{display:block}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">🧬</div>
      <div class="brand-text"><b>EvoMentor DE</b><span>v1.2 · Integriertes Werkzeug</span></div>
    </div>
    <nav class="viewnav" id="viewnav"></nav>
    <div class="sidebar-foot">
      <button class="icon-btn" id="btnCollapse" title="Seitenleiste ein-/ausklappen">⇤</button>
      <button class="icon-btn" id="btnTheme" title="Hell/Dunkel">🌓</button>
      <button class="icon-btn" id="btnExportAll" title="Alles exportieren">⭳</button>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <button class="icon-btn" id="btnMobileNav" style="display:none">☰</button>
      <h1 id="viewTitle">Lernziele</h1>
      <span class="sub" id="viewSub"></span>
      <div class="topbar-spacer"></div>
      <div class="searchbox"><span>🔎</span><input id="globalSearch" placeholder="Suche über alle Klassenstufen…"></div>
      <button class="pill-btn" id="btnFavorites">★ <span id="favCount">0</span></button>
    </div>
    <div id="viewport">
      <div id="viewLernziele" class="view"></div>
      <div id="viewBasiskonzepte" class="view"></div>
      <div id="viewEvokonzepte" class="view"></div>
      <div id="viewSequenz" class="view"></div>
      <div id="viewPrompt" class="view"></div>
      <div id="viewForschung" class="view"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalBox"></div></div>
<div id="toastwrap"></div>
<div id="sidebarScrim"></div>

<script>
/* =========================================================================
   EvoMentor DE v1.2 — core: data loading, unified annotation store, shared UI
   ========================================================================= */
(function(){
'use strict';

const EM = window.EM = {
  data: { mnt56:null, gy78:null, gy910:null, basiskonzepte:null, evolutionskonzepte:null, kohaerenzfaeden:null },
  lz: [],           // flattened array of all lernziele across grade bands, each tagged with .band
  lzById: {},
  bkById: {},
  tkById: {},
  ekById: {},       // evolutionskonzept by id
  ekByLabel: {},    // evolutionskonzept by bezeichnung (controlled-vocab lookup)
  threads: [],
  view: 'lernziele',
};

const BAND_META = {
  mnt56: { label:'Kl. 5/6', color:'#7c3aed', file:'lernziele_MNT56.json' },
  gy78:  { label:'Kl. 7/8', color:'#2563eb', file:'lernziele_gy78.json' },
  gy910: { label:'Kl. 9/10',color:'#0d9488', file:'lernziele_gy910.json' },
};
EM.BAND_META = BAND_META;

const BK_COLOR = {
  bk_struktur_funktion:'var(--bk-struktur)',
  bk_stoff_energie_umwandlung:'var(--bk-stoff)',
  bk_information_kommunikation:'var(--bk-info)',
  bk_steuerung_regelung:'var(--bk-steuerung)',
  bk_individuelle_entwicklung:'var(--bk-individuell)',
  bk_evolutive_entwicklung:'var(--bk-evolutiv)',
};
EM.BK_COLOR = BK_COLOR;

const BK_ORDER = ['bk_evolutive_entwicklung','bk_individuelle_entwicklung',
  'bk_struktur_funktion','bk_steuerung_regelung',
  'bk_stoff_energie_umwandlung','bk_information_kommunikation'];
EM.BK_ORDER = BK_ORDER;
function sortByBkOrder(ids){ return ids.slice().sort((a,b)=>BK_ORDER.indexOf(a)-BK_ORDER.indexOf(b)); }
EM.sortByBkOrder = sortByBkOrder;

/* per-Basiskonzept relevance lookup on a Lernziel's basiskonzeptbezug array */
function bkBezug(e, bkId){ return (e.basiskonzeptbezug||[]).find(b=>b.basiskonzept_id===bkId) || null; }
EM.bkBezug = bkBezug;
function evoBezug(e){ return bkBezug(e, 'bk_evolutive_entwicklung'); }
EM.evoBezug = evoBezug;

const KONZEPTANKER_DEF = 'ein Lernziel, das einen besonders konkreten, anschaulichen Einstiegspunkt in ein Basiskonzept bildet.';
EM.KONZEPTANKER_DEF = KONZEPTANKER_DEF;

/* ---------- tiny utils ---------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
EM.esc = esc;
function el(tag, attrs, html){ const e=document.createElement(tag); if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]); if(html!=null) e.innerHTML = html; return e; }
EM.el = el;
function toast(msg){
  const t = el('div', {class:'toast'}, esc(msg));
  document.getElementById('toastwrap').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 250); }, 2600);
}
EM.toast = toast;

function openModal(titleHtml, bodyHtml, footHtml){
  const box = document.getElementById('modalBox');
  box.innerHTML = `<div class="modal-head"><h3>${titleHtml}</h3><div style="flex:1"></div><button class="icon-btn" id="modalClose">✕</button></div>`+
                   `<div class="modal-body">${bodyHtml}</div>`+
                   (footHtml ? `<div class="modal-foot">${footHtml}</div>` : '');
  document.getElementById('modalBackdrop').classList.add('open');
  document.getElementById('modalClose').onclick = closeModal;
  return box;
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('open'); }
EM.openModal = openModal; EM.closeModal = closeModal;
document.getElementById('modalBackdrop').addEventListener('click', e => { if(e.target.id==='modalBackdrop') closeModal(); });

/* ---------- unified annotation / edit / favorites / tags store ----------
   Single localStorage namespace replacing v1.1's evomentor_*_v1, the
   lernziele_evolution* apps' bio_*_v2/v3, and lehrplannavigator's
   lk_edits/lk_annots + sequenz.html's session-only accept/dismiss state.  */
const LS_KEY = 'em2_state_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* ignore corrupt state */ }
  return { annotations:{}, edits:{}, tags:[], seqPlan:{}, seqEmphasis:{}, seqCustomLessons:{}, prefs:{ theme:'auto', sidebarCollapsed:false } };
}
EM.state = loadState();
let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(LS_KEY, JSON.stringify(EM.state)); }catch(e){ console.warn('state save failed', e); }
  }, 150);
}
EM.saveState = saveState;

function ann(id){
  if(!EM.state.annotations[id]) EM.state.annotations[id] = { favorit:false, notizen:'', userTags:[], methFavs:{} };
  return EM.state.annotations[id];
}
EM.ann = ann;
function isFav(id){ return !!(EM.state.annotations[id] && EM.state.annotations[id].favorit); }
EM.isFav = isFav;
function toggleFav(id){
  const a = ann(id); a.favorit = !a.favorit; saveState(); refreshFavCount();
  return a.favorit;
}
EM.toggleFav = toggleFav;
function refreshFavCount(){
  const n = Object.values(EM.state.annotations).filter(a=>a.favorit).length;
  const elx = document.getElementById('favCount'); if(elx) elx.textContent = n;
}
EM.refreshFavCount = refreshFavCount;

/* ---------- data loading ---------- */
async function fetchJson(path){
  const res = await fetch(path);
  if(!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  return res.json();
}

/* Erweiterte Unterkonzept-Taxonomien der 5 nicht-evolutionären Basiskonzepte
   (schema/unterkonzept.schema.json) — analog zu evolutionskonzepte.json,
   aber je Basiskonzept in einer eigenen Datei mit eigenem Label-Namensraum. */
const UK_FILE_BY_BK = {
  bk_individuelle_entwicklung: { path: '../data/individuelleentwicklungkonzepte.json', key: 'individuelleentwicklungkonzepte' },
  bk_struktur_funktion: { path: '../data/strukturfunktionkonzepte.json', key: 'strukturfunktionkonzepte' },
  bk_stoff_energie_umwandlung: { path: '../data/stoffenergiekonzepte.json', key: 'stoffenergiekonzepte' },
  bk_information_kommunikation: { path: '../data/informationkommunikationkonzepte.json', key: 'informationkommunikationkonzepte' },
  bk_steuerung_regelung: { path: '../data/steuerungregelungkonzepte.json', key: 'steuerungregelungkonzepte' },
};
EM.UK_FILE_BY_BK = UK_FILE_BY_BK;

async function loadAll(){
  const ukEntries = Object.entries(UK_FILE_BY_BK);
  const [mnt56, gy78, gy910, bkData, ekData, kfData, ...ukData] = await Promise.all([
    fetchJson('../data/lernziele_MNT56.json'),
    fetchJson('../data/lernziele_gy78.json'),
    fetchJson('../data/lernziele_gy910.json'),
    fetchJson('../data/basiskonzepte.json'),
    fetchJson('../data/evolutionskonzepte.json'),
    fetchJson('../data/kohaerenzfaeden.json'),
    ...ukEntries.map(([,f]) => fetchJson(f.path)),
  ]);
  EM.data.mnt56=mnt56; EM.data.gy78=gy78; EM.data.gy910=gy910;
  EM.data.basiskonzepte=bkData; EM.data.evolutionskonzepte=ekData; EM.data.kohaerenzfaeden=kfData;

  EM.lz = [];
  for(const band of ['mnt56','gy78','gy910']){
    const src = EM.data[band].lernziele || [];
    for(const item of src){
      const copy = Object.assign({}, item, { band });
      EM.lz.push(copy);
      EM.lzById[item.id] = copy;
    }
  }

  EM.bkById = {}; EM.tkById = {};
  for(const bk of bkData.basiskonzepte){
    EM.bkById[bk.id] = bk;
    for(const tk of (bk.teilkonzepte||[])) EM.tkById[tk.id] = tk;
  }

  EM.ekById = {}; EM.ekByLabel = {};
  for(const ek of ekData.evolutionskonzepte){
    EM.ekById[ek.id] = ek;
    EM.ekByLabel[ek.bezeichnung] = ek;
  }

  EM.data.unterkonzepte = {}; EM.ukById = {}; EM.ukByLabel = {};
  ukEntries.forEach(([bkId, f], i) => {
    const nodes = ukData[i][f.key] || [];
    EM.data.unterkonzepte[bkId] = nodes;
    EM.ukById[bkId] = {}; EM.ukByLabel[bkId] = {};
    for(const uk of nodes){
      EM.ukById[bkId][uk.id] = uk;
      EM.ukByLabel[bkId][uk.bezeichnung] = uk;
    }
  });

  EM.threads = kfData.kohaerenzfaeden || [];
}
EM.loadAll = loadAll;

/* ---------- erweiterte Unterkonzept-Taxonomien (5 nicht-evolutionäre Basiskonzepte) ----------
   Strukturell analog zur Evolutionskonzepte-Taxonomie-Ansicht weiter unten, aber generisch
   über EM.data.unterkonzepte[bkId] statt der Evolution-spezifischen evolutionskonzepte.json. */
function lzForUnterkonzept(bkId, bezeichnung){
  return EM.lz.filter(e => { const b = bkBezug(e, bkId); return b && (b.relevante_unterkonzepte||[]).includes(bezeichnung); });
}
EM.lzForUnterkonzept = lzForUnterkonzept;

function verwandteKonzepteHtml(node){
  if(!(node.verwandte_konzepte||[]).length) return '';
  return `<p style="font-size:10.5px; color:var(--txt-3); margin:4px 0"><b>siehe auch:</b> ${node.verwandte_konzepte.map(v=>`${esc(EM.bkById[v.basiskonzept_id]?EM.bkById[v.basiskonzept_id].kurzbezeichnung:v.basiskonzept_id)}: ${esc(v.konzept_bezeichnung)} <span title="${esc(v.beziehung)}" style="cursor:help">ⓘ</span>`).join(' · ')}</p>`;
}

function unterkonzepteTaxonomyHtml(bkId){
  const nodes = (EM.data.unterkonzepte && EM.data.unterkonzepte[bkId]) || [];
  if(!nodes.length) return '<div style="color:var(--txt-3); font-size:12px">Keine erweiterte Taxonomie hinterlegt.</div>';
  const all = nodes.slice().sort((a,b)=>a.reihenfolge-b.reihenfolge);
  const top = all.filter(n=>n.ebene===1);
  const countFor = (n) => {
    const own = lzForUnterkonzept(bkId, n.bezeichnung).length;
    if(n.ebene===1){
      const children = all.filter(c=>c.uebergeordnetes_konzept===n.id);
      return own + children.reduce((s,c)=>s+lzForUnterkonzept(bkId, c.bezeichnung).length, 0);
    }
    return own;
  };
  return top.map(t=>{
    const children = all.filter(c=>c.uebergeordnetes_konzept===t.id).sort((a,b)=>a.reihenfolge-b.reihenfolge);
    const n = countFor(t);
    const ownLinked = lzForUnterkonzept(bkId, t.bezeichnung);
    return `<details style="margin-bottom:6px">
      <summary style="cursor:pointer; font-size:12.5px; font-weight:650; padding:4px 0">${esc(t.bezeichnung)} <span class="tag" style="background:var(--bg-alt)">${n}</span></summary>
      <div style="padding:4px 0 6px 14px">
        <p style="font-size:12px; color:var(--txt-2); margin:4px 0">${esc(t.definition||'')}</p>
        ${verwandteKonzepteHtml(t)}
        ${!children.length && ownLinked.length?`<div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px">${ownLinked.map(e=>`<span class="tag" style="background:var(--bg-alt);color:var(--txt-2); cursor:pointer" data-goto="${esc(e.id)}">${esc(e.id)}</span>`).join('')}</div>`:''}
        ${children.map(c=>{
          const linked = lzForUnterkonzept(bkId, c.bezeichnung);
          return `<details style="margin:6px 0">
            <summary style="cursor:pointer; font-size:12px">${esc(c.bezeichnung)} <span class="tag" style="background:var(--bg-alt); font-size:10px">${linked.length}</span></summary>
            <div style="padding:4px 0 4px 14px">
              <p style="font-size:11.5px; color:var(--txt-2); margin:4px 0">${esc(c.definition||'')}</p>
              ${verwandteKonzepteHtml(c)}
              <div style="display:flex; flex-wrap:wrap; gap:5px">${linked.map(e=>`<span class="tag" style="background:var(--bg-alt);color:var(--txt-2); cursor:pointer" data-goto="${esc(e.id)}">${esc(e.id)}</span>`).join('') || '<span style="color:var(--txt-3); font-size:11px">Keine direkten Treffer</span>'}</div>
            </div>
          </details>`;
        }).join('')}
      </div>
    </details>`;
  }).join('');
}
EM.unterkonzepteTaxonomyHtml = unterkonzepteTaxonomyHtml;

/* ---------- view registry & navigation ---------- */
/* evokonzepte (folded into Basiskonzepte > Detail), sequenz and forschung
   are deliberately left out of this nav for now — their render functions
   and DOM containers stay intact, just unreachable, so re-enabling later
   is a one-line change here. */
const VIEWS = [
  { section:'Erkunden' },
  { id:'lernziele', icon:'📋', label:'Lernziele', sub:'Browser über alle Klassenstufen 5–10' },
  { id:'basiskonzepte', icon:'🕸️', label:'Basiskonzepte', sub:'Dashboard, Konzeptnetz, Details' },
  { section:'Planen' },
  { id:'prompt', icon:'🤖', label:'KI-Prompt-Generator', sub:'Unterrichtsvorbereitung mit KI-Unterstützung' },
];
EM.VIEWS = VIEWS;

function buildNav(){
  const nav = document.getElementById('viewnav');
  nav.innerHTML = '';
  for(const v of VIEWS){
    if(v.section){ nav.appendChild(el('div',{class:'nav-section-label'}, esc(v.section))); continue; }
    const item = el('div', {class:'nav-item', 'data-view':v.id}, `<span class="ic">${v.icon}</span><span class="lbl">${esc(v.label)}</span>`);
    item.onclick = () => setView(v.id);
    nav.appendChild(item);
  }
}

function setView(id){
  EM.view = id;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view===id));
  document.querySelectorAll('.view').forEach(n => n.classList.remove('active'));
  const meta = VIEWS.find(v=>v.id===id);
  document.getElementById('viewTitle').textContent = meta ? meta.label : id;
  document.getElementById('viewSub').textContent = meta ? meta.sub : '';
  const map = { lernziele:'viewLernziele', basiskonzepte:'viewBasiskonzepte', evokonzepte:'viewEvokonzepte', sequenz:'viewSequenz', prompt:'viewPrompt', forschung:'viewForschung' };
  const node = document.getElementById(map[id]);
  node.classList.add('active');
  location.hash = id;
  if(EM.renderers[id]) EM.renderers[id]();
}
EM.setView = setView;
EM.renderers = {}; // populated by each view module below

/* ---------- boot ---------- */
async function boot(){
  buildNav();
  refreshFavCount();
  // theme
  const savedTheme = EM.state.prefs.theme;
  if(savedTheme && savedTheme!=='auto') document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('btnTheme').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur==='dark' ? 'light' : (cur==='light' ? null : 'dark');
    if(next) document.documentElement.setAttribute('data-theme', next); else document.documentElement.removeAttribute('data-theme');
    EM.state.prefs.theme = next || 'auto'; saveState();
  };
  document.getElementById('btnCollapse').onclick = () => {
    document.getElementById('sidebar').classList.toggle('collapsed');
  };
  const scrim = document.getElementById('sidebarScrim');
  document.getElementById('btnMobileNav').onclick = () => {
    document.getElementById('sidebar').classList.add('mobile-open');
    scrim.classList.add('show');
  };
  scrim.onclick = () => { document.getElementById('sidebar').classList.remove('mobile-open'); scrim.classList.remove('show'); };
  document.getElementById('viewnav').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('mobile-open'); scrim.classList.remove('show');
  });

  try{
    await loadAll();
  }catch(e){
    document.getElementById('viewLernziele').classList.add('active');
    document.getElementById('viewLernziele').innerHTML = `<div class="view-empty">⚠️ Daten konnten nicht geladen werden: ${esc(e.message)}.<br>Diese App lädt Daten per <code>fetch()</code> relativ zu <code>../data/</code> — bitte über einen lokalen Server öffnen (z. B. <code>python -m http.server</code> im Repo-Root) oder über GitHub Pages, nicht per Doppelklick/<code>file://</code>.</div>`;
    return;
  }

  const startView = (location.hash||'').replace('#','') || 'lernziele';
  setView(VIEWS.find(v=>v.id===startView) ? startView : 'lernziele');

  document.getElementById('globalSearch').addEventListener('input', e => {
    EM.globalQuery = e.target.value.trim().toLowerCase();
    if(EM.view==='lernziele' && EM.renderers.lernziele) EM.renderers.lernziele();
  });
  document.getElementById('btnFavorites').onclick = () => {
    setView('lernziele');
    EM.lernzieleFilters.favOnly = true;
    EM.renderers.lernziele();
  };
}

document.addEventListener('DOMContentLoaded', boot);
})();
</script>

<script>
/* =========================================================================
   VIEW: Lernziele-Browser
   ========================================================================= */
(function(){
'use strict';
const esc = EM.esc;
function emptyBkFilters(){
  const o = {};
  for(const id of EM.BK_ORDER) o[id] = { relevance:new Set(), teilkonzepte:new Set(), expanded:false };
  return o;
}
function anyBkFilterActive(bf){ return EM.BK_ORDER.some(id=>bf[id].relevance.size||bf[id].teilkonzepte.size); }
const BAND_ORDER = ['mnt56','gy78','gy910'];
function defaultFilters(){ return { bands:new Set(BAND_ORDER), bkFilters:emptyBkFilters(), thema:'', unterthema:'', praktischOnly:false, ankerOnly:false, favOnly:false, sort:'id', view:'card', allExpanded:false }; }
EM.lernzieleFilters = defaultFilters();

const METHOD_ICON = { 'Forschendes Lernen':'🔬','Analogien und Vergleiche':'🔗','Konzeptuelles Lernen':'🧩','Diskussion':'💬','Narrativer Zugang':'📖','Modelle und Simulationen':'🧪','Erfahrungsbasiertes Lernen':'🖐️','Digitale Medien':'💻','Einblick in Wissenschaftsgeschichte':'🏛️','Recherche':'📚','Kooperative Lernformen':'👥','Projektbasiertes Lernen':'🛠️' };

const BK_ABBR = {
  bk_evolutive_entwicklung:'Evo. Ent.', bk_individuelle_entwicklung:'Ind. Entw.',
  bk_struktur_funktion:'Str/Fkt', bk_steuerung_regelung:'Steu/Reg',
  bk_stoff_energie_umwandlung:'Stoff/En', bk_information_kommunikation:'Info/Komm',
};
function bkTagRowHtml(e){
  return `<div style="display:flex; flex-wrap:wrap; gap:9px; margin-bottom:8px; font-size:11px">
    ${EM.BK_ORDER.map(id=>{
      const b = EM.bkBezug(e, id); if(!b) return '';
      const r = b.relevanz_beurteilung;
      return `<span style="display:inline-flex; align-items:center; gap:3px; color:${EM.BK_COLOR[id]}" title="${esc(EM.bkById[id]?EM.bkById[id].bezeichnung:id)}"><b>${BK_ABBR[id]||id}</b><span style="letter-spacing:1px">${'●'.repeat(r)}${'○'.repeat(3-r)}</span></span>`;
    }).join('')}
  </div>`;
}

function matchesFilters(e){
  const F = EM.lernzieleFilters;
  if(!F.bands.has(e.band)) return false;
  if(anyBkFilterActive(F.bkFilters)){
    const ok = EM.BK_ORDER.some(bkId=>{
      const f = F.bkFilters[bkId];
      if(!f.relevance.size && !f.teilkonzepte.size) return false;
      const b = EM.bkBezug(e, bkId);
      if(!b) return false;
      if(f.relevance.size && !f.relevance.has(b.relevanz_beurteilung)) return false;
      if(f.teilkonzepte.size && !(b.relevante_teilkonzepte||[]).some(t=>f.teilkonzepte.has(t))) return false;
      return true;
    });
    if(!ok) return false;
  }
  if(F.thema && e.thema !== F.thema) return false;
  if(F.unterthema && e.unterthema !== F.unterthema) return false;
  if(F.praktischOnly && !e.ist_praktisch) return false;
  if(F.ankerOnly && !e.ist_konzeptanker) return false;
  if(F.favOnly && !EM.isFav(e.id)) return false;
  const q = (EM.globalQuery||'') || (F.q||'');
  if(q){
    const hay = (e.id+' '+e.kurzbezeichnung+' '+e.originaltext+' '+e.thema+' '+e.unterthema).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function sortEntries(list){
  const F = EM.lernzieleFilters;
  const arr = list.slice();
  if(F.sort==='id') arr.sort((a,b)=>a.id.localeCompare(b.id));
  else if(F.sort==='band') arr.sort((a,b)=> (BAND_ORDER.indexOf(a.band)-BAND_ORDER.indexOf(b.band)) || a.id.localeCompare(b.id));
  else if(F.sort==='relevance') arr.sort((a,b)=> ((EM.evoBezug(b)?.relevanz_beurteilung)||0) - ((EM.evoBezug(a)?.relevanz_beurteilung)||0));
  else if(F.sort==='fav') arr.sort((a,b)=> (EM.isFav(b.id)?1:0) - (EM.isFav(a.id)?1:0));
  return arr;
}

function renderFilterPanel(){
  const F = EM.lernzieleFilters;
  const themen = Array.from(new Set(EM.lz.filter(e=>F.bands.has(e.band)).map(e=>e.thema)));
  const unterthemenPool = EM.lz.filter(e=>F.bands.has(e.band) && (!F.thema || e.thema===F.thema));
  const unterthemen = Array.from(new Set(unterthemenPool.map(e=>e.unterthema).filter(Boolean)));
  return `
  <div class="card card-pad" style="position:sticky; top:0">
    <div class="section-h">Klassenstufe</div>
    <div style="display:flex; flex-wrap:wrap; gap:6px">
      ${Object.entries(EM.BAND_META).map(([b,m])=>`<span class="chip ${F.bands.has(b)?'on':''}" data-band="${b}">${m.label}</span>`).join('')}
    </div>
    <div class="section-h">Basiskonzepte &amp; Relevanz</div>
    <div style="display:flex; flex-direction:column; gap:4px; margin-bottom:6px">
      ${EM.BK_ORDER.map(id=>{
        const bk = EM.bkById[id]; if(!bk) return '';
        const bf = F.bkFilters[id];
        const active = bf.relevance.size||bf.teilkonzepte.size;
        return `<details ${bf.expanded||active?'open':''} class="bk-filter-group" data-bkgroup="${id}">
          <summary style="cursor:pointer; font-size:12.5px; padding:4px 0; display:flex; align-items:center; gap:6px; ${active?`color:${EM.BK_COLOR[id]}; font-weight:650`:''}"><span class="badge-dot" style="background:${EM.BK_COLOR[id]}"></span>${esc(bk.bezeichnung)}</summary>
          <div style="padding:4px 0 8px 18px">
            <div style="font-size:11px; color:var(--txt-3); margin-bottom:4px">Relevanz</div>
            <div style="display:flex; gap:5px; margin-bottom:6px">
              ${[1,2,3].map(r=>`<span class="chip ${bf.relevance.has(r)?'on':''}" data-bkrel="${id}:${r}">${'●'.repeat(r)}</span>`).join('')}
            </div>
            ${(bk.teilkonzepte||[]).length?`<div style="font-size:11px; color:var(--txt-3); margin-bottom:4px">Unterkonzepte</div>
            <div style="display:flex; flex-direction:column; gap:3px">
              ${(bk.teilkonzepte||[]).map(tk=>`<label style="display:flex;gap:6px;align-items:center;font-size:11.5px"><input type="checkbox" data-bktk="${id}:${tk.id}" ${bf.teilkonzepte.has(tk.id)?'checked':''}> ${esc(tk.bezeichnung)}</label>`).join('')}
            </div>`:''}
          </div>
        </details>`;
      }).join('')}
    </div>
    <div class="section-h">Thema</div>
    <select id="filThema" style="width:100%">
      <option value="">Alle Themen</option>
      ${themen.map(t=>`<option ${F.thema===t?'selected':''}>${esc(t)}</option>`).join('')}
    </select>
    <div class="section-h">Unterthema</div>
    <select id="filUnterthema" style="width:100%">
      <option value="">Alle Unterthemen</option>
      ${unterthemen.map(t=>`<option ${F.unterthema===t?'selected':''}>${esc(t)}</option>`).join('')}
    </select>
    <div class="section-h">Weitere Filter</div>
    <label style="display:flex;gap:7px;align-items:center;margin-bottom:6px;font-size:12.5px"><input type="checkbox" id="filPraktisch" ${F.praktischOnly?'checked':''}> nur praktische Lernziele</label>
    <label style="display:flex;gap:7px;align-items:center;margin-bottom:6px;font-size:12.5px"><input type="checkbox" id="filAnker" ${F.ankerOnly?'checked':''}> nur Konzeptanker <span title="${esc(EM.KONZEPTANKER_DEF)}" style="cursor:help; color:var(--txt-3)">ⓘ</span></label>
    <label style="display:flex;gap:7px;align-items:center;font-size:12.5px"><input type="checkbox" id="filFav" ${F.favOnly?'checked':''}> nur Favoriten ★</label>
    <hr class="sep">
    <button class="pill-btn" id="filReset" style="width:100%">Filter zurücksetzen</button>
  </div>`;
}

function bkBezugBlockHtml(e, bkId){
  const b = EM.bkBezug(e, bkId); if(!b) return '';
  const bk = EM.bkById[bkId];
  const relDots = '●'.repeat(b.relevanz_beurteilung) + '○'.repeat(3-b.relevanz_beurteilung);
  const tkNames = (b.relevante_teilkonzepte||[]).map(id=>(EM.tkById[id]&&EM.tkById[id].bezeichnung)||id);
  return `<div class="acc" data-acc="bk-${bkId}-${e.id}">
    <div class="acc-h"><span class="badge-dot" style="background:${EM.BK_COLOR[bkId]}"></span> ${esc(bk?bk.kurzbezeichnung:bkId)} <span style="color:${EM.BK_COLOR[bkId]}; letter-spacing:1px">${relDots}</span> <span class="acc-arrow">▾</span></div>
    <div class="acc-b">
      <p style="margin:8px 0">${esc(b.begruendung)}</p>
      ${(bkId==='bk_evolutive_entwicklung' && (b.relevante_evolutionskonzepte||[]).length)?`<div style="display:flex; flex-wrap:wrap; gap:5px; margin-top:6px">${b.relevante_evolutionskonzepte.map(k=>`<span class="chip" style="cursor:default">${esc(k)}</span>`).join('')}</div>`:''}
      ${(b.relevante_unterkonzepte||[]).length?`<div style="display:flex; flex-wrap:wrap; gap:5px; margin-top:6px">${b.relevante_unterkonzepte.map(k=>`<span class="chip" style="cursor:default">${esc(k)}</span>`).join('')}</div>`:''}
      ${tkNames.length?`<div style="display:flex; flex-wrap:wrap; gap:5px; margin-top:6px">${tkNames.map(n=>`<span class="chip" style="cursor:default; background:var(--bg-alt)">${esc(n)}</span>`).join('')}</div>`:''}
    </div>
  </div>`;
}

function didaktikBlockHtml(e){
  const ds = e.didaktische_strategien; if(!ds) return '';
  const mf = EM.ann(e.id).methFavs || {};
  return `<div class="acc" data-acc="dida-${e.id}">
    <div class="acc-h">🎓 Didaktische Strategien <span class="acc-arrow">▾</span></div>
    <div class="acc-b">
      <p style="margin:8px 0"><b>${esc(ds.evolutionsdidaktischer_impuls)}</b></p>
      <ol style="margin:6px 0; padding-left:18px">
        ${(ds.top3_methoden||[]).map(m=>`<li style="margin-bottom:5px; display:flex; align-items:flex-start; gap:6px"><span style="flex:1">${METHOD_ICON[m.methode]||'•'} <b>${esc(m.methode)}</b> — ${esc(m.beschreibung)}</span><button class="icon-btn meth-fav-btn" data-lz="${esc(e.id)}" data-rang="${m.rang}" style="${mf[m.rang]?'color:var(--amber); border-color:var(--amber)':''}" title="Methode favorisieren">${mf[m.rang]?'★':'☆'}</button></li>`).join('')}
      </ol>
      <p style="margin:8px 0; color:var(--amber)"><b>⚠ Fehlvorstellungen:</b> ${esc(ds.moegliche_fehlvorstellungen)}</p>
      <p style="margin:0; color:var(--txt-3); font-size:12px">${esc(ds.bezug_zum_lehrplan_kontext||'')}</p>
    </div>
  </div>`;
}

function cardHtml(e){
  const bandM = EM.BAND_META[e.band];
  const fav = EM.isFav(e.id);
  return `<div class="card lz-card" data-id="${esc(e.id)}" style="border-top:3px solid ${bandM.color}">
    <div class="card-pad">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px">
        <div>
          <div style="font-size:10.5px; color:var(--txt-3); font-weight:650">${esc(e.id)} · ${bandM.label}</div>
          <div style="font-weight:650; font-size:14px; margin-top:2px">${esc(e.kurzbezeichnung)}</div>
        </div>
        <button class="icon-btn fav-btn" data-id="${esc(e.id)}" style="${fav?'color:var(--amber); border-color:var(--amber)':''}">${fav?'★':'☆'}</button>
      </div>
      <p style="font-size:12.5px; color:var(--txt-2); margin:8px 0">${esc(e.originaltext)}</p>
      ${(e.ist_praktisch||e.ist_konzeptanker)?`<div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px">
        ${e.ist_praktisch?'<span class="tag" style="background:var(--blue-pale);color:var(--blue)">🧪 praktisch</span>':''}
        ${e.ist_konzeptanker?`<span class="tag" style="background:var(--purple-pale);color:var(--purple)" title="${esc(EM.KONZEPTANKER_DEF)}">⚓ Konzeptanker</span>`:''}
      </div>`:''}
      ${bkTagRowHtml(e)}
      <div class="acc-wrap">${EM.BK_ORDER.map(id=>bkBezugBlockHtml(e,id)).join('')}${didaktikBlockHtml(e)}</div>
      <div style="margin-top:10px; display:flex; gap:6px; align-items:center; flex-wrap:wrap">
        ${(EM.ann(e.id).userTags||[]).map(t=>`<span class="chip" style="background:var(--purple-pale);color:var(--purple)">#${esc(t)}</span>`).join('')}
        <button class="pill-btn tag-btn" data-id="${esc(e.id)}" style="margin-left:auto; font-size:11px; padding:4px 9px">🏷️ Tag/Notiz</button>
      </div>
    </div>
  </div>`;
}

function render(){
  const host = document.getElementById('viewLernziele');
  const F = EM.lernzieleFilters;
  const filtered = sortEntries(EM.lz.filter(matchesFilters));
  host.innerHTML = `
  <div style="display:grid; grid-template-columns:250px 1fr; gap:16px; align-items:start">
    <div id="lzFilterPanel">${renderFilterPanel()}</div>
    <div>
      <div style="display:flex; align-items:center; margin-bottom:12px; gap:8px; flex-wrap:wrap">
        <div style="font-size:13px; color:var(--txt-2)"><b>${filtered.length}</b> von ${EM.lz.length} Lernzielen</div>
        <div style="flex:1"></div>
        <select id="filSort" style="font-size:12.5px">
          <option value="id" ${F.sort==='id'?'selected':''}>Sortierung: ID</option>
          <option value="band" ${F.sort==='band'?'selected':''}>Sortierung: Klassenstufe</option>
          <option value="relevance" ${F.sort==='relevance'?'selected':''}>Sortierung: Evolutionsrelevanz</option>
          <option value="fav" ${F.sort==='fav'?'selected':''}>Sortierung: Favoriten zuerst</option>
        </select>
        <button class="pill-btn" id="btnToggleAll">${F.allExpanded?'⌃ Alle zuklappen':'⌄ Alle aufklappen'}</button>
        <button class="pill-btn ${F.view==='card'?'primary':''}" id="btnViewCard">▦ Karten</button>
        <button class="pill-btn ${F.view==='list'?'primary':''}" id="btnViewList">☰ Liste</button>
        <button class="pill-btn" id="btnExportLz">⭳ Export</button>
      </div>
      <div id="lzResults" class="${F.view==='list'?'lz-list':''}" style="display:grid; gap:14px; grid-template-columns:${F.view==='list'?'1fr':'repeat(auto-fill,minmax(380px,1fr))'}"></div>
      ${filtered.length===0 ? '<div class="view-empty">Keine Lernziele entsprechen den aktuellen Filtern.</div>' : ''}
    </div>
  </div>
  <style>
    .acc-h{cursor:pointer; font-size:12.5px; font-weight:650; padding:8px 0; display:flex; align-items:center; gap:6px; border-top:1px solid var(--border)}
    .acc-arrow{margin-left:auto; transition:.15s}
    .acc.open .acc-arrow{transform:rotate(180deg)}
    .acc-b{display:none; font-size:12.5px; color:var(--txt-2)}
    .acc.open .acc-b{display:block}
    .lz-list .card-pad{padding:10px 14px}
  </style>`;

  const resHost = document.getElementById('lzResults');
  resHost.innerHTML = filtered.map(cardHtml).join('');
  if(F.allExpanded) resHost.querySelectorAll('.acc').forEach(a=>a.classList.add('open'));

  // wire filter panel
  document.querySelectorAll('#lzFilterPanel [data-band]').forEach(c=>c.onclick=()=>{ const b=c.dataset.band; F.bands.has(b)?F.bands.delete(b):F.bands.add(b); render(); });
  document.querySelectorAll('#lzFilterPanel [data-bkgroup]').forEach(d=>d.addEventListener('toggle', ()=>{ F.bkFilters[d.dataset.bkgroup].expanded = d.open; }));
  document.querySelectorAll('#lzFilterPanel [data-bkrel]').forEach(c=>c.onclick=()=>{ const [id,r]=c.dataset.bkrel.split(':'); const s=F.bkFilters[id].relevance; const rn=+r; s.has(rn)?s.delete(rn):s.add(rn); render(); });
  document.querySelectorAll('#lzFilterPanel [data-bktk]').forEach(c=>c.onchange=()=>{ const [id,tk]=c.dataset.bktk.split(':'); const s=F.bkFilters[id].teilkonzepte; s.has(tk)?s.delete(tk):s.add(tk); render(); });
  const t = document.getElementById('filThema'); if(t) t.onchange = ()=>{ F.thema = t.value; F.unterthema=''; render(); };
  const ut = document.getElementById('filUnterthema'); if(ut) ut.onchange = ()=>{ F.unterthema = ut.value; render(); };
  const fp = document.getElementById('filPraktisch'); if(fp) fp.onchange = ()=>{ F.praktischOnly = fp.checked; render(); };
  const fa = document.getElementById('filAnker'); if(fa) fa.onchange = ()=>{ F.ankerOnly = fa.checked; render(); };
  const ff = document.getElementById('filFav'); if(ff) ff.onchange = ()=>{ F.favOnly = ff.checked; render(); };
  const fr = document.getElementById('filReset'); if(fr) fr.onclick = ()=>{ EM.lernzieleFilters = defaultFilters(); render(); };
  const fs = document.getElementById('filSort'); if(fs) fs.onchange = ()=>{ F.sort = fs.value; render(); };
  const bta = document.getElementById('btnToggleAll'); if(bta) bta.onclick = ()=>{ F.allExpanded = !F.allExpanded; render(); };
  const bvc = document.getElementById('btnViewCard'); if(bvc) bvc.onclick = ()=>{ F.view = 'card'; render(); };
  const bvl = document.getElementById('btnViewList'); if(bvl) bvl.onclick = ()=>{ F.view = 'list'; render(); };

  // wire cards
  resHost.querySelectorAll('.acc-h').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'));
  resHost.querySelectorAll('.fav-btn').forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); EM.toggleFav(b.dataset.id); render(); });
  resHost.querySelectorAll('.meth-fav-btn').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    const a = EM.ann(b.dataset.lz);
    a.methFavs = a.methFavs||{};
    a.methFavs[b.dataset.rang] = !a.methFavs[b.dataset.rang];
    EM.saveState(); render();
  });
  resHost.querySelectorAll('.tag-btn').forEach(b=>b.onclick=()=>openTagModal(b.dataset.id));

  document.getElementById('btnExportLz').onclick = ()=>EM.openExportModal(filtered);
}

function openTagModal(id){
  const a = EM.ann(id);
  const body = `
    <div class="section-h">Eigene Tags (Komma-getrennt)</div>
    <input type="text" id="tagInput" style="width:100%" value="${esc((a.userTags||[]).join(', '))}">
    <div class="section-h">Notiz</div>
    <textarea id="noteInput" style="width:100%; min-height:90px">${esc(a.notizen||'')}</textarea>`;
  const foot = `<button class="pill-btn" onclick="EM.closeModal()">Abbrechen</button><button class="pill-btn primary" id="tagSave">Speichern</button>`;
  EM.openModal(`Anmerkungen — ${esc(id)}`, body, foot);
  document.getElementById('tagSave').onclick = () => {
    a.userTags = document.getElementById('tagInput').value.split(',').map(s=>s.trim()).filter(Boolean);
    a.notizen = document.getElementById('noteInput').value;
    EM.saveState(); EM.closeModal(); EM.toast('Gespeichert'); render();
  };
}

EM.renderers.lernziele = render;
})();
</script>

<script>
/* =========================================================================
   SHARED: unified export (JSON / CSV / Markdown-Unterrichtsplan / Print)
   Replaces the disjoint export paths of v1.1, sequenz.html and the
   lernziele_evolution* apps with one export surface over the same
   annotation store for every view.
   ========================================================================= */
(function(){
'use strict';
const esc = EM.esc;

function csvEscape(v){ const s = (v==null?'':String(v)); return '"'+s.replace(/"/g,'""')+'"'; }

function toCsv(list){
  const headers = ['id','band','thema','unterthema','kurzbezeichnung','originaltext','basiskonzepte_primaer','evolutionsrelevanz','favorit','tags','notizen'];
  const rows = [headers.join(';')];
  for(const e of list){
    const a = EM.ann(e.id);
    rows.push([
      e.id, e.band, e.thema, e.unterthema, e.kurzbezeichnung, e.originaltext,
      e.basiskonzepte_primaer.join('|'),
      EM.evoBezug(e) ? EM.evoBezug(e).relevanz_beurteilung : '',
      a.favorit ? 'ja':'nein',
      (a.userTags||[]).join('|'),
      a.notizen||''
    ].map(csvEscape).join(';'));
  }
  return rows.join('\r\n');
}

function toMarkdownPlan(list){
  const favs = list.filter(e=>EM.isFav(e.id));
  const useList = favs.length ? favs : list;
  const byThema = {};
  for(const e of useList) (byThema[e.thema] = byThema[e.thema]||[]).push(e);
  let md = `# Unterrichtsplan — EvoMentor DE Export\n\n_Erstellt: ${new Date().toLocaleString('de-DE')}_\n\n`;
  if(favs.length) md += `> Nur Favoriten (${favs.length} von ${list.length} Lernzielen im aktuellen Filter)\n\n`;
  for(const thema in byThema){
    md += `## ${thema}\n\n`;
    for(const e of byThema[thema]){
      const a = EM.ann(e.id);
      md += `### ${e.id} — ${e.kurzbezeichnung}\n\n`;
      md += `${e.originaltext}\n\n`;
      md += `**Basiskonzepte:** ${e.basiskonzepte_primaer.join(', ')}\n\n`;
      for(const bkId of EM.BK_ORDER){
        const b = EM.bkBezug(e, bkId);
        if(b) md += `**${EM.bkById[bkId]?EM.bkById[bkId].kurzbezeichnung:bkId}** (Relevanz ${b.relevanz_beurteilung}/3): ${b.begruendung}\n\n`;
      }
      if(e.didaktische_strategien){
        md += `**Leitfrage:** ${e.didaktische_strategien.evolutionsdidaktischer_impuls}\n\n`;
        md += `**Methoden:** ${e.didaktische_strategien.top3_methoden.map(m=>m.methode).join(', ')}\n\n`;
      }
      if(a.notizen) md += `**Notiz:** ${a.notizen}\n\n`;
      md += `---\n\n`;
    }
  }
  return md;
}

function download(filename, content, mime){
  const blob = new Blob([content], {type: mime+';charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

EM.openExportModal = function(list){
  const body = `
    <p style="font-size:12.5px; color:var(--txt-2)">Export bezieht sich auf die aktuell gefilterte Liste (<b>${list.length}</b> Lernziele) inklusive Ihrer Favoriten, Tags und Notizen.</p>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px">
      <button class="pill-btn" id="exJson">📄 JSON</button>
      <button class="pill-btn" id="exCsv">📊 CSV (Excel)</button>
      <button class="pill-btn" id="exMd">📝 Markdown-Unterrichtsplan</button>
      <button class="pill-btn" id="exPrint">🖨️ Drucken / PDF</button>
    </div>`;
  EM.openModal('Exportieren', body, `<button class="pill-btn" onclick="EM.closeModal()">Schließen</button>`);
  document.getElementById('exJson').onclick = () => {
    const payload = { exportiert: new Date().toISOString(), tool:'EvoMentor DE v1.2', anzahl:list.length, lernziele:list.map(e=>Object.assign({}, e, {_annotation: EM.ann(e.id)})) };
    download('evomentor_export.json', JSON.stringify(payload, null, 2), 'application/json');
    EM.toast('JSON heruntergeladen');
  };
  document.getElementById('exCsv').onclick = () => { download('evomentor_export.csv', toCsv(list), 'text/csv'); EM.toast('CSV heruntergeladen'); };
  document.getElementById('exMd').onclick = () => { download('unterrichtsplan.md', toMarkdownPlan(list), 'text/markdown'); EM.toast('Markdown heruntergeladen'); };
  document.getElementById('exPrint').onclick = () => { window.print(); };
};

document.getElementById('btnExportAll').addEventListener('click', () => EM.openExportModal(EM.lz));
})();
</script>

<script>
/* =========================================================================
   VIEW: Basiskonzepte-Explorer (Netz / Dashboard / Kohärenzfäden / Detail)
   ========================================================================= */
(function(){
'use strict';
const esc = EM.esc;
let sub = 'dashboard';
let selectedConcept = null;
let netzSelected = null;
let netzViewBoxStr = null;

const REL_STYLE = {
  ermöglicht:{color:'#2563eb', dash:'0'}, benoetigt:{color:'#2563eb', dash:'4,3'},
  implementiert:{color:'#7c3aed', dash:'0'}, wird_implementiert_durch:{color:'#7c3aed', dash:'4,3'},
  implementiert_durch:{color:'#7c3aed', dash:'4,3'},
  steuert:{color:'#0d9488', dash:'0'}, wird_gesteuert_durch:{color:'#0d9488', dash:'4,3'},
  reguliert:{color:'#0d9488', dash:'0'}, regelt:{color:'#0d9488', dash:'0'},
  wird_reguliert_durch:{color:'#0d9488', dash:'4,3'}, wird_geregelt_durch:{color:'#0d9488', dash:'4,3'},
  erklaert_entstehung_von:{color:'#16a34a', dash:'0'}, wird_erklaert_durch:{color:'#e11d48', dash:'2,3'},
};
const REL_DEFAULT_STYLE = {color:'#94a3b8', dash:'0'};

function bkList(){ return EM.data.basiskonzepte.basiskonzepte; }

function hexPositions(n, cx, cy, r){
  const pts=[];
  for(let i=0;i<n;i++){ const a = -Math.PI/2 + i*2*Math.PI/n; pts.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); }
  return pts;
}

function netzLinkedLz(id, isTop, c){
  if(isTop) return EM.lz.filter(e=>EM.bkBezug(e,id)?.relevanz_beurteilung===3);
  return EM.lz.filter(e=>(EM.bkBezug(e, c.uebergeordnetes_bk)?.relevante_teilkonzepte||[]).includes(id));
}

function netzInfoPanelHtml(id){
  const isTop = !!EM.bkById[id];
  const c = isTop ? EM.bkById[id] : EM.tkById[id];
  if(!c) return '<div style="color:var(--txt-3); font-size:12.5px">Konzept anklicken, um seine Verbindungen und verknüpften Lernziele anzuzeigen.</div>';
  const conns = isTop ? (c.bk_verbindungen||[]) : [];
  const linked = netzLinkedLz(id, isTop, c);
  return `
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap">
      <span class="badge-dot" style="width:12px;height:12px;background:${EM.BK_COLOR[isTop?id:c.uebergeordnetes_bk]}"></span>
      <b style="font-size:13.5px">${esc(c.bezeichnung)}</b>
      <span class="tag" style="background:var(--bg-alt); color:var(--txt-2)">${linked.length} Lernziele${isTop?' (hohe Relevanz)':''}</span>
      <button class="pill-btn" id="netzShowLz" style="margin-left:auto; font-size:11px; padding:4px 9px">🔎 in Lernzielen anzeigen</button>
      <button class="pill-btn" id="netzOpenDetail" style="font-size:11px; padding:4px 9px">📖 im Detail öffnen</button>
    </div>
    ${isTop ? (conns.length ? conns.map(v=>`<div style="font-size:12px; margin-bottom:5px"><b>${esc(v.beziehungstyp)}</b> → ${esc(EM.bkById[v.ziel_bk]?.bezeichnung||v.ziel_bk)}: ${esc(v.beschreibung)}</div>`).join('') : '<div style="color:var(--txt-3); font-size:12px">Keine ausgehenden Verbindungen erfasst.</div>')
      : `<p style="font-size:12px; color:var(--txt-2); margin:0">${esc(c.beschreibung_didaktisch||c.beschreibung_kmk||'')}</p>`}
    ${linked.length?`<div style="display:flex; flex-wrap:wrap; gap:5px; margin-top:8px">${linked.slice(0,24).map(e=>`<span class="tag" style="background:var(--bg-alt); color:var(--txt-2); cursor:pointer" data-goto="${esc(e.id)}">${esc(e.id)}</span>`).join('')}${linked.length>24?`<span style="font-size:11px; color:var(--txt-3)">+${linked.length-24} weitere</span>`:''}</div>`:''}
  `;
}

function attachZoomPan(svgEl, W, H){
  let vb = {x:0,y:0,w:W,h:H};
  const apply = ()=>svgEl.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  if(netzViewBoxStr){ const p = netzViewBoxStr.split(' ').map(Number); vb={x:p[0],y:p[1],w:p[2],h:p[3]}; apply(); }
  svgEl.addEventListener('wheel', ev=>{
    ev.preventDefault();
    const rect = svgEl.getBoundingClientRect();
    const mx = vb.x + (ev.clientX-rect.left)/rect.width*vb.w;
    const my = vb.y + (ev.clientY-rect.top)/rect.height*vb.h;
    const factor = ev.deltaY>0 ? 1.12 : 1/1.12;
    const newW = Math.min(W*2, Math.max(W*0.35, vb.w*factor));
    const newH = newW/W*H;
    vb.x = mx - (mx-vb.x)*(newW/vb.w); vb.y = my - (my-vb.y)*(newH/vb.h);
    vb.w = newW; vb.h = newH;
    netzViewBoxStr = `${vb.x} ${vb.y} ${vb.w} ${vb.h}`;
    apply();
  }, {passive:false});
  // Only engage pan/pointer-capture once real movement is detected — capturing
  // on pointerdown unconditionally used to steal the click event before it could
  // reach a node's own click handler, so clicking a concept silently did nothing.
  let dragging=false, captured=false, lastX=0, lastY=0;
  svgEl.addEventListener('pointerdown', ev=>{ dragging=true; lastX=ev.clientX; lastY=ev.clientY; });
  svgEl.addEventListener('pointermove', ev=>{
    if(!dragging) return;
    const dx = ev.clientX-lastX, dy = ev.clientY-lastY;
    if(!captured){
      if(Math.hypot(dx,dy)<3) return;
      svgEl.setPointerCapture(ev.pointerId); captured=true; svgEl.style.cursor='grabbing';
    }
    const rect = svgEl.getBoundingClientRect();
    vb.x -= dx/rect.width*vb.w; vb.y -= dy/rect.height*vb.h;
    lastX=ev.clientX; lastY=ev.clientY;
    netzViewBoxStr = `${vb.x} ${vb.y} ${vb.w} ${vb.h}`;
    apply();
  });
  svgEl.addEventListener('pointerup', ev=>{
    dragging=false;
    if(captured){ svgEl.releasePointerCapture(ev.pointerId); captured=false; }
    svgEl.style.cursor='grab';
  });
  svgEl.style.cursor='grab';
}

function renderNetz(host){
  const W=980,H=640, cx=W/2, cy=H/2, R=195;
  const bks = EM.sortByBkOrder(bkList().map(b=>b.id)).map(id=>EM.bkById[id]);
  const pos = {};
  hexPositions(bks.length, cx, cy, R).forEach((p,i)=>pos[bks[i].id]=p);
  // teilkonzepte around each parent
  const tkPos = {};
  bks.forEach(bk=>{
    const [px,py] = pos[bk.id];
    const angle = Math.atan2(py-cy, px-cx);
    (bk.teilkonzepte||[]).forEach((tk,i)=>{
      const off = (i===0?-1:1)*0.36;
      const a = angle+off;
      tkPos[tk.id] = [cx+(R+80)*Math.cos(a), cy+(R+80)*Math.sin(a)];
    });
  });

  const markerColors = Array.from(new Set(Object.values(REL_STYLE).map(s=>s.color).concat([REL_DEFAULT_STYLE.color])));
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:640px">`;
  svg += `<defs>${markerColors.map(c=>`<marker id="arrow-${c.slice(1)}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>`).join('')}</defs>`;
  // edges
  bks.forEach(bk=>{
    (bk.bk_verbindungen||[]).forEach(v=>{
      const a = pos[bk.id], b = pos[v.ziel_bk]; if(!a||!b) return;
      const style = REL_STYLE[v.beziehungstyp] || REL_DEFAULT_STYLE;
      const involved = netzSelected && (bk.id===netzSelected || v.ziel_bk===netzSelected);
      const dim = netzSelected && !involved;
      const opacity = dim ? 0.08 : (involved ? 0.95 : 0.55);
      const width = involved ? 2.4 : 1.6;
      const mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2;
      svg += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${style.color}" stroke-width="${width}" stroke-dasharray="${style.dash}" opacity="${opacity}" marker-end="url(#arrow-${style.color.slice(1)})"><title>${esc(bk.kurzbezeichnung)} ${esc(v.beziehungstyp)} ${esc(EM.bkById[v.ziel_bk]?.kurzbezeichnung||v.ziel_bk)}: ${esc(v.beschreibung)}</title></line>`;
      if(!dim) svg += `<text x="${mx}" y="${my}" text-anchor="middle" font-size="8.5" fill="${style.color}" pointer-events="none" style="paint-order:stroke fill; stroke:var(--panel); stroke-width:3px">${esc(v.beziehungstyp)}</text>`;
    });
  });
  // hierarchy edges + TK nodes
  bks.forEach(bk=>{
    (bk.teilkonzepte||[]).forEach(tk=>{
      const a = pos[bk.id], b = tkPos[tk.id];
      svg += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#cbd5e1" stroke-width="1"/>`;
    });
  });
  bks.forEach(bk=>{
    (bk.teilkonzepte||[]).forEach(tk=>{
      const [x,y] = tkPos[tk.id];
      const on = selectedConcept===tk.id || netzSelected===tk.id;
      const dim = netzSelected && netzSelected!==tk.id && netzSelected!==bk.id;
      svg += `<circle cx="${x}" cy="${y}" r="15" stroke-width="2" class="tk-node" data-id="${tk.id}" opacity="${dim?0.3:1}" style="cursor:pointer; fill:${on?EM.BK_COLOR[bk.id]:'var(--panel)'}; stroke:${EM.BK_COLOR[bk.id]}"/>`;
      svg += `<text x="${x}" y="${y+28}" text-anchor="middle" font-size="9" fill="var(--txt-3)" opacity="${dim?0.3:1}" pointer-events="none">${esc((tk.kurzbezeichnung.split('–')[1]||tk.bezeichnung).trim().slice(0,16))}</text>`;
    });
  });
  // BK nodes
  bks.forEach(bk=>{
    const [x,y] = pos[bk.id];
    const dim = netzSelected && netzSelected!==bk.id && !(bk.bk_verbindungen||[]).some(v=>v.ziel_bk===netzSelected) && !bks.some(b2=>b2.id===netzSelected && (b2.bk_verbindungen||[]).some(v=>v.ziel_bk===bk.id));
    svg += `<circle cx="${x}" cy="${y}" r="38" opacity="${dim?0.3:0.9}" class="bk-node" data-id="${bk.id}" style="cursor:pointer; fill:${EM.BK_COLOR[bk.id]}${netzSelected===bk.id?'; stroke:var(--txt); stroke-width:3':''}"/>`;
    svg += `<text x="${x}" y="${y-4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" opacity="${dim?0.5:1}" pointer-events="none">${esc(bk.kurzbezeichnung)}</text>`;
    svg += `<text x="${x}" y="${y+11}" text-anchor="middle" font-size="8" fill="#fff" opacity="${dim?0.3:.85}" pointer-events="none">Kl. ${bk.id.includes('evolut')||bk.id.includes('individuelle')?'5–10':'7–8'}</text>`;
  });
  svg += `</svg>`;

  const legendItems = [
    ['#2563eb','ermöglicht','benötigt'], ['#7c3aed','implementiert','wird implementiert durch'],
    ['#0d9488','steuert / reguliert / regelt','wird gesteuert/reguliert/geregelt durch'],
    ['#16a34a','erklärt Entstehung von', null], ['#e11d48', null, 'wird erklärt durch'],
  ];
  const legendHtml = legendItems.map(([c,solid,dashed])=>`
    <span style="display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--txt-2)">
      ${solid?`<svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="${c}" stroke-width="2"/></svg> ${esc(solid)}`:''}
      ${dashed?`<svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="${c}" stroke-width="2" stroke-dasharray="4,3"/></svg> ${esc(dashed)}`:''}
    </span>`).join('');

  host.innerHTML = `
    <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap">
      <span style="color:var(--txt-3); font-size:11.5px">Kreise = Basiskonzepte (groß) und Unterkonzepte (klein) · Pfeile = gerichtete bk_verbindungen (durchgezogen = Grundrelation, gestrichelt = deren Kehrseite) · Mausrad = Zoom, Ziehen = Verschieben · Klick auf ein Konzept hebt seine Verbindungen hervor und zeigt verknüpfte Lernziele</span>
    </div>
    <div class="card" style="padding:8px; overflow:hidden">${svg}</div>
    <div class="card card-pad" style="margin-top:10px; display:flex; gap:14px; flex-wrap:wrap">${legendHtml}</div>
    <div class="card card-pad" style="margin-top:10px" id="netzInfoPanel">${netzInfoPanelHtml(netzSelected)}</div>
  `;
  const svgEl = host.querySelector('svg');
  attachZoomPan(svgEl, W, H);
  host.querySelectorAll('.bk-node, .tk-node').forEach(n=>n.addEventListener('click', ev=>{
    ev.stopPropagation();
    netzSelected = (netzSelected===n.dataset.id) ? null : n.dataset.id;
    renderNetz(host);
  }));
  const infoPanel = document.getElementById('netzInfoPanel');
  wireGotoLinks(infoPanel);
  const openBtn = document.getElementById('netzOpenDetail');
  if(openBtn) openBtn.onclick = ()=>{ selectedConcept = netzSelected; sub='detail'; renderSub(); };
  const showLzBtn = document.getElementById('netzShowLz');
  if(showLzBtn) showLzBtn.onclick = ()=>{
    const isTop = !!EM.bkById[netzSelected];
    const tk = isTop ? null : EM.tkById[netzSelected];
    const bkId = isTop ? netzSelected : (tk && tk.uebergeordnetes_bk);
    if(!bkId) return;
    EM.lernzieleFilters.bkFilters[bkId].expanded = true;
    if(isTop) EM.lernzieleFilters.bkFilters[bkId].relevance = new Set([3]);
    else EM.lernzieleFilters.bkFilters[bkId].teilkonzepte = new Set([netzSelected]);
    EM.setView('lernziele');
  };
}

const GRADES = ['5','6','7','8','9','10'];

function computeMatrix(lz){
  const m = {};
  for(const id of EM.BK_ORDER){
    m[id] = {};
    for(const g of GRADES){
      const cell = lz.filter(e=>e.empfohlene_klassenstufe===g);
      const n1 = cell.filter(e=>EM.bkBezug(e,id)?.relevanz_beurteilung===1).length;
      const n2 = cell.filter(e=>EM.bkBezug(e,id)?.relevanz_beurteilung===2).length;
      const n3 = cell.filter(e=>EM.bkBezug(e,id)?.relevanz_beurteilung===3).length;
      const anker = cell.filter(e=>e.ist_konzeptanker && EM.bkBezug(e,id)?.relevanz_beurteilung===3).length;
      m[id][g] = { n1, n2, n3, anker, total: cell.length };
    }
  }
  return m;
}

function wireGotoLinks(root){
  root.querySelectorAll('[data-goto]').forEach(s=>s.onclick=()=>{ EM.setView('lernziele'); document.getElementById('globalSearch').value=s.dataset.goto; EM.globalQuery=s.dataset.goto.toLowerCase(); EM.renderers.lernziele(); });
}

function openConceptNoteModal(id, label, onSaved){
  const a = EM.ann(id);
  const body = `<div class="section-h">Notiz / Feedback zu „${esc(label)}"</div><textarea id="conceptNoteInput" style="width:100%; min-height:110px">${esc(a.notizen||'')}</textarea>`;
  const foot = `<button class="pill-btn" onclick="EM.closeModal()">Abbrechen</button><button class="pill-btn primary" id="conceptNoteSave">Speichern</button>`;
  EM.openModal(`Notiz — ${esc(label)}`, body, foot);
  document.getElementById('conceptNoteSave').onclick = () => {
    a.notizen = document.getElementById('conceptNoteInput').value;

function wireConceptDetail(root){
  wireGotoLinks(root);
  const btn = root.querySelector('#conceptNoteBtn');
  if(btn) btn.onclick = () => openConceptNoteModal(btn.dataset.noteid, btn.dataset.label, () => {
    root.innerHTML = conceptDetailHtml(selectedConcept);
    wireConceptDetail(root);
  });
}

function renderDetail(host){
  const bks = EM.sortByBkOrder(bkList().map(b=>b.id)).map(id=>EM.bkById[id]);
  host.innerHTML = `<div style="display:grid; grid-template-columns:230px 1fr; gap:16px">

        ${(bk.teilkonzepte||[]).map(tk=>`<div class="nav-item" data-sel="${tk.id}" style="padding-left:26px; font-size:12px; ${selectedConcept===tk.id?'background:var(--teal-pale);color:var(--teal)':''}"><span class="badge-dot" style="background:${EM.BK_COLOR[bk.id]}"></span>${esc(tk.bezeichnung)}</div>`).join('')}
      `).join('')}

    <div id="conceptDetailHost">${conceptDetailHtml(selectedConcept || bks[0].id)}</div>

  wireConceptDetail(document.getElementById('conceptDetailHost'));
  host.querySelectorAll('#detailNavHost [data-sel]').forEach(n=>n.onclick=()=>{

      x.style.background = on?'var(--teal-pale)':''; x.style.color = on?'var(--teal)':'';

    cdh.innerHTML = conceptDetailHtml(selectedConcept);
